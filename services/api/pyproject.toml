[project]
name = "afterledger"
version = "0.1.0"
description = "AfterLedger API: domain, agent workflows and the HTTP service"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sse-starlette==3.5.0",
  "python-multipart==0.0.32",
  "google-genai==2.30.1",
  "google-adk==2.12.0",
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "python-dotenv==1.2.4",
  "pymupdf==1.28.2",
  "pillow==12.3.0",
  "pillow-heif==1.8.0",        # phone photos in HEIC, turned into JPEG on upload
  "python-stdnum==2.2",
  "holidays==0.106",
  "rapidfuzz==3.14.6",
  "babel==2.18.0",
  "tzdata==2026.5",            # the time zone database, for zoneinfo on Windows
]

[project.optional-dependencies]
gcp = [
  "google-cloud-documentai==3.16.0",
  "google-cloud-discoveryengine==0.20.5",
  "google-cloud-firestore==2.34.1",
  "google-cloud-storage==3.17.0",
  "google-cloud-tasks==2.26.0",
  "google-cloud-translate==3.28.0",
  "google-cloud-bigquery==3.46.1",
  "google-cloud-modelarmor==0.7.2",
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "hypothesis==6.169.0",
  "ruff==0.17.0",
  "mypy==2.4.0",
]

[project.scripts]
afterledger = "afterledger.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afterledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
  "ignore::UserWarning",
]
markers = [
  "slow: end-to-end runs over every demo family",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008", "SIM108", "RUF012"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
