    cites: [gb_tuo_what, gb_tuo_28_days]
    label: sure
    status: confirmed
    holding: h_state_pension
  - key: premium_bonds
    category: premium_bonds
    kind: asset
    group: nsi_prize
    institution_id: gb_nsandi
    title: Premium Bonds with NS&I
    sentence: Prizes are paid into the account the bondholder chose. Two prizes in five months suggest Margaret held bonds.
    investigator_note: "NS&I PRIZE credits of £25.00 on 2 March and £50.00 on 2 July. Prizes are paid on the first working days of the month, as these were."
    critic_note: The bonds could be in someone else's name, with prizes paid into her account.
    how_to_confirm: Look for a bond certificate, an NS&I letter or her holder's number; or start the claim online, which needs no account.
    next_step_note: The bonds can stay in the prize draws for up to 12 months after the death.
    signals: {cadence: irregular, product_match: "yes"}
    cites: [gb_nsi_claim_online, gb_nsi_12_months]
    label: likely
    status: open
    holding: h_bonds
  - key: instant_saver
    category: bank_account
    kind: asset
    holding_kind: savings
    group: instant_saver
    institution_id: gb_aire_valley_bank
    title: An Instant Saver account at Aire Valley Bank
    sentence: £200 moved on the 3rd of every month to an Instant Saver ending 0012 at the same bank, so she had a second account there.
    investigator_note: Twelve transfers of £200 to INSTANT SAVER 55180012. The account is in her name at Aire Valley Bank; its balance is not on this statement.
    how_to_confirm: Her yearly savings statement, or ask Aire Valley Bank for the balance on the date of death.
    next_step_note: The same bereavement claim covers both accounts.
    signals: {cadence: monthly, product_match: "yes"}
    cites: [gb_airevalley_documents]
    family_value: "21560.00"
    family_note: Her yearly savings statement says £21,560.00.
    label: sure
    status: confirmed
    holding: h_aire_saver
