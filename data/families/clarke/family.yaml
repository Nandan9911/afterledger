    title: Council tax paid by direct debit
    sentence: Leeds City Council took council tax on the 1st of each month. Tell Us Once tells the council; any credit on her account goes back to the estate.
    investigator_note: Ten payments of £148.00 a year, April to January, from LEEDS CC COUNCIL TAX DD.
    how_to_confirm: The council writes to the executor once Tell Us Once has been used.
