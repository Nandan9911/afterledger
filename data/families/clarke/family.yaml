    title: Her State Pension
    sentence: The Department for Work and Pensions paid her State Pension every four weeks. Tell Us Once stops it and tells the other government offices in one go.
    investigator_note: Thirteen credits of £739.60 from DWP STATE PENSION, exactly 28 days apart.
    how_to_confirm: Use the Tell Us Once reference the registrar gave Thomas.
    next_step_note: Any pension paid for the days after her death is worked out and recovered by the department.
