# The Clarke family's papers (Leeds, England). Every bank, building society and pension scheme is
# fictional; the death certificate uses a generic layout with a sample watermark. Dates are written
# for the story day 14 October 2026 and shift with it.
papers:
  # --------------------------------------------------------------------------------------------
  - id: death_cert
    title: Death certificate
    doc_type: death_certificate
    country: GB
    languages: [en]
    scripts: [Latn]
    origin: photo
    uploaded_by: p_thomas
    uploaded_on: 2026-09-17
    template: certificate
    style: {accent: "#6B2737", lang: en, size: 9}
    pre_title: "Registration District: Leeds (sample specimen)"
    titles:
      - {text: "CERTIFIED COPY OF AN ENTRY OF DEATH", size: 13}
    subtitle: "Pursuant to the Births and Deaths Registration Act 1953 · Specimen for the AfterLedger demo"
    sections:
      - kv:
          - ["1. Date and place of death", "{d:2026-09-14|d_month_y}, St James's University Hospital, Leeds", date_place_of_death]
          - ["2. Name and surname", "Margaret Anne CLARKE", deceased_name]
          - ["3. Sex", "Female", sex]
          - ["4. Maiden surname of woman who has married", "HOLLINS", maiden_name]
          - ["5. Date and place of birth", "{d:1945-02-11|d_month_y}, Bradford", birth_date_place]
          - ["6. Occupation and usual address", "Retired mill office clerk, widow of Peter James Clarke. 22 Hawthorn Grove, Leeds LS6 4QT", occupation_address]
          - ["7. Name and surname of informant", "Thomas Edward CLARKE, son", informant]
          - ["8. Cause of death", "Ia Pneumonia  Ib Chronic obstructive pulmonary disease", cause_of_death]
          - ["9. Date of registration", "{d:2026-09-17|d_month_y}", registration_date]
          - ["Entry number", "SYN 0917/214", registration_number]
        label_w: 210
    stamp: {text: "REGISTRAR · LEEDS · SPECIMEN", round: true}
    signature: {label: "Registrar", name: "J. Oyelaran"}
    note: "This is a sample document created for the AfterLedger demo. It is not a certificate and has no legal effect."
    photo: {angle: -0.9, blur: 0.4, tint: "#F4F1EA"}
    fields:
      deceased_name: {value: Margaret Anne Clarke}
      birth_date: {value: 1945-02-11}
      date_of_death: {value: 2026-09-14}
      place_of_death: {value: Leeds}
      registration_date: {value: 2026-09-17}

