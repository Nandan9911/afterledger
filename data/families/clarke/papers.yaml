    uploaded_by: p_thomas
    uploaded_on: 2026-09-18
    template: letter
    style: {accent: "#3B3B3B", lang: en, size: 9.5}
    subject: "THIS IS THE LAST WILL of me MARGARET ANNE CLARKE of 22 Hawthorn Grove, Leeds LS6 4QT"
    subject_field: testator
    body:
      - "1. I revoke all earlier wills and codicils."
      - {text: "2. I appoint my son THOMAS EDWARD CLARKE of 9 Beech Rise, Harrogate HG2 7PL to be the executor of this will.", field: executor}
      - "3. I give all my estate to my children THOMAS EDWARD CLARKE and HELEN MARY OWEN in equal shares absolutely, after paying my debts, funeral expenses and the expenses of administering my estate."
      - "4. If either of my children dies before me, their share goes to their own children in equal shares."
      - {text: "Signed by MARGARET ANNE CLARKE on {d:2019-05-03|d_month_y} in our presence and then by us in hers.", field: date_of_will}
    after:
      - "Witness 1: Susan K. Pickles, 18 Hawthorn Grove, Leeds, retired teacher"
      - "Witness 2: David R. Ainsworth, 3 Cardigan Road, Leeds, pharmacist"
      - "COPY · The original is held by the executor. Sample document created for the AfterLedger demo."
    fields:
      testator: {value: MARGARET ANNE CLARKE}
      executor: {value: THOMAS EDWARD CLARKE}
      date_of_will: {value: 2019-05-03}
