# The intake conversation (Sunita, by voice, in Hindi).
intake:
  started_on: 2026-09-08
  by: p_sunita
  turns:
    - role: assistant
      lang: hi
      text: नमस्ते। आपके नुकसान का हमें बहुत दुख है। सबसे पहले, क्या आप बताएँगी कि किनका देहांत हुआ है?
      translation: Namaste. We are very sorry for your loss. First, could you tell us who has passed away?
    - role: family
      person: p_sunita
      lang: hi
      channel: voice
      seconds: 14
      text: मेरे पति, राजेश कुमार वर्मा। दो सितंबर को लखनऊ में, कुछ महीनों की बीमारी के बाद। वो सरकारी स्कूल में पढ़ाते थे, फिर वीआरएस ले लिया था।
      translation: My husband, Rajesh Kumar Verma. On 2 September, in Lucknow, after a few months of illness. He taught at a government school, then took voluntary retirement.
    - role: assistant
      lang: hi
      text: धन्यवाद। पैसों का काम कौन देखता था? और क्या आपके पास बैंक के कोई कागज़ हैं?
      translation: Thank you. Who looked after the money? And do you have any bank papers?
    - role: family
      person: p_sunita
      lang: hi
      channel: voice
      seconds: 22
      text: सब वही देखते थे। दो बैंक हैं, सह्याद्रि और नर्मदा। एक एफडी भी है। बेटा अमित पुणे में है, वो फोटो भेज देगा।
      translation: He handled everything. There are two banks, Sahyadri and Narmada. There is a fixed deposit too. Our son Amit is in Pune; he will send photos.
    - role: assistant
      lang: hi
      text: ठीक है। एक बात और - क्या राजेश जी की माँ जीवित हैं? बैंक के कागज़ों पर उनकी सहमति भी लग सकती है।
      translation: All right. One more thing - is Rajesh ji's mother alive? The bank papers may need her consent too.
      why: A mother is a Class I heir under the Hindu Succession Act, so her consent may be needed.
      cites: [in_hsa_class1_list, in_rbi_288_disclaimer]
    - role: family
      person: p_sunita
      lang: hi
      channel: voice
      seconds: 6
      text: हाँ, अम्मा जी हमारे साथ रहती हैं। कमला देवी।
      translation: Yes, Amma ji lives with us. Kamla Devi.

