today_tasks:
  - kind: follow_up
    institution_id: in_narmada_bank
    title: Remind Narmada Bank that the claim is overdue
    local: {lang: hi, title: "नर्मदा बैंक को याद दिलाएँ कि दावे में देर हो चुकी है", body: "बैंक ने 24 सितंबर को लिखकर माना था कि उसके पास सारे कागज़ हैं। नियम के अनुसार 15 दिन में, यानी 9 अक्टूबर तक, भुगतान होना था। देरी के लिए बैंक पर अब तक ₹835 बनते हैं, और हर दिन ₹167 और।"}
  - kind: sign
    institution_id: in_awadh_securities
    title: Sign the demat transfer papers
    body: "Sunita signs the request and the indemnity. All three legal heirs - Sunita, Amit and Kamla Devi - sign the affidavit and no-objection before a notary."
    local: {lang: hi, title: "डीमैट के कागज़ों पर हस्ताक्षर करें", body: "सुनीता जी अनुरोध पत्र और क्षतिपूर्ति बांड पर हस्ताक्षर करेंगी। तीनों कानूनी वारिस - सुनीता, अमित और कमला देवी - नोटरी के सामने हलफ़नामे और अनापत्ति पत्र पर हस्ताक्षर करेंगे। कागज़ तैयार हैं।"}
  - kind: find
    lead_category: locker
    title: Look for the locker key
    body: Sahyadri Bank takes locker rent every April, so Rajesh probably had a locker there. The key and the locker agreement will make the visit quicker.
    local: {lang: hi, title: "लॉकर की चाबी ढूँढें", body: "सह्याद्रि बैंक हर अप्रैल लॉकर का किराया लेता है, तो शायद वहाँ राजेश जी का लॉकर है। चाबी और लॉकर का अनुबंध मिल जाए तो बैंक का काम जल्दी होगा।"}

