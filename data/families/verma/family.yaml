# Hidden items the papers point to, for scoring discovery and for the offline investigators.
# 'group' names the statement lines (papers.yaml meta.group); texts are what the agents should conclude.
leads:
  - key: pmjjby
    category: life_cover
    kind: entitlement
    group: pmjjby
    institution_id: in_pmjjby
    title: PMJJBY life cover of ₹2,00,000
    sentence: A ₹436 debit every May is the premium for PMJJBY, a government life cover of ₹2,00,000. Rajesh was 52, and cover runs to 55 once enrolled, so it was live when he died.
    investigator_note: "The premium of ₹436 a year is debited automatically, and this one was taken in May 2026 for the year 2026-27. PMJJBY pays ₹2,00,000 on death from any cause, and cover continues to 55 for anyone who joined before 50."
    how_to_confirm: The nominee claims at the Sahyadri Bank branch where the account is held.
    next_step_note: Claim preferably within 30 days of the death; the bank forwards it within 7 days and the insurer pays within 7 days after that.
    signals: {cadence: yearly, product_match: "yes"}
    cites: [in_pmjjby_premium, in_pmjjby_cover, in_pmjjby_age, in_pmjjby_claim_30_days]
    value: "200000.00"
    label: sure
    status: confirmed
    holding: h_pmjjby
  - key: mf_sip
    category: mutual_fund
    kind: asset
    group: mf_sip
    institution_id: in_cams
    title: Mutual fund units bought every month
    sentence: ₹5,000 left his account on the 5th of every month as a SIP through CAMS, a registrar for mutual funds. Which fund it bought is not known yet.
    investigator_note: "Six debits of ₹5,000 on the 5th, narration ACH D- NACH MF SIP CAMS 4471. CAMS keeps the records for many fund houses, so the fund itself is not named."
    how_to_confirm: Ask CAMS for a consolidated account statement, which names the fund and the units.
    next_step_note: The units pass to the heirs under SEBI's transmission framework once the fund is known.
    signals: {cadence: monthly, product_match: "yes"}
    cites: [in_sebi_applies_amc, in_sebi_value_nav]
    label: sure
    status: confirmed
    holding: h_mf
  - key: family_pension
    category: pension
    kind: entitlement
    group: pension
    institution_id: in_up_treasury
    title: A family pension for Sunita
    sentence: His state pension of ₹38,450 arrived on the 1st of every month. Sunita can probably apply for a family pension, and pension paid after the death has to be sorted out with the pension office.
    investigator_note: Six credits of ₹38,450 from PENSION UP TREASURY LKO, one each month.
    how_to_confirm: Write to the pension office; its rules for this state have not been checked yet.
    signals: {cadence: monthly, product_match: partial}
    cites: [in_rbi_295_credit_after]
    label: likely
    status: confirmed
    holding: h_family_pension
  - key: locker
    category: locker
    kind: asset
    group: locker_rent
    institution_id: in_sahyadri_bank
    title: A safe deposit locker at Sahyadri Bank
    sentence: Sahyadri Bank takes locker rent every April, so Rajesh probably had a locker there.
    investigator_note: Sahyadri Bank charges locker rent once a year, in April, and this ₹2,360 debit is labelled locker rent for 2026-27. No locker key or agreement is among the papers.
    critic_note: A bank can keep charging rent after a locker is given up if nobody told it. Ask the bank before planning a visit.
    how_to_confirm: Ask Sahyadri Bank whether he hired a locker and whether a nominee was registered for it.
    next_step_note: If the locker exists, a nominee can open it with three papers; without one, the heirs use the simplified route. The bank has 15 days once it has every paper, or it pays ₹5,000 for each day of delay.
    signals: {cadence: yearly, product_match: "yes", paper: "no", known_rent: "yes"}
    cites: [in_sahyadri_locker_rent, in_rbi_299_locker_nominee, in_rbi_309_locker_simplified, in_rbi_320_locker_15_days, in_rbi_322_locker_compensation]
    label: likely
    status: open
    holding: h_locker
  - key: gomti_shares
    category: shares
    kind: asset
    group: gomti_div
    institution_id: in_gomti_paper_mills
    title: Shares in Gomti Paper Mills, probably on paper certificates
    sentence: Dividends of ₹1,240 from Gomti Paper Mills arrived in March and June, but the company is not in his demat account.
    investigator_note: Two dividend credits of ₹1,240, three months apart. The company pays dividends into the bank account registered with its registrar, and his demat statement does not hold its shares, so the shares are probably paper certificates.
    critic_note: The shares could be in Sunita's name, with the dividends paid into his account.
    how_to_confirm: Look for share certificates at home, or ask the company's registrar which folio pays into this account.
    next_step_note: Paper shares pass under SEBI's framework; the original certificates are needed.
    signals: {cadence: quarterly, product_match: "no"}
    alternatives: [The shares are in another family member's name]
    downgrade: true
    cites: [in_gomti_dividends, in_gomti_registrar, in_sebi_physical_original]
    label: possible
    status: open
    holding: h_gomti
  - key: scooter_loan
    category: loan
    kind: debt
    group: scooter_emi
    institution_id: in_sahyadri_bank
    title: A two-wheeler loan at Sahyadri Bank
    sentence: Sahyadri Bank takes ₹2,150 on the 5th of each month for a two-wheeler loan. Ask for the exact balance and whether the loan had insurance before the next instalment.
    monthly: "2150.00"
    family_value: "38200.00"
    family_note: About ₹38,200 is left, going by the loan papers at home.
    cites: [in_sahyadri_loans]
    label: sure
    status: open
    holding: h_scooter_loan
  - key: pmsby
    category: accident_cover
    kind: entitlement
    group: pmsby
    institution_id: in_pmsby
    title: PMSBY accident cover
    sentence: A ₹20 debit in May is the premium for PMSBY, a government accident cover.
    investigator_note: The premium was paid for 2026-27, so the cover was in force.
    critic_note: PMSBY pays only for accidental death or disability, and Rajesh died of an illness.
    how_to_confirm: Nothing to claim unless the death was caused by an accident.
    signals: {cadence: yearly, product_match: "yes"}
    cites: [in_pmsby_premium, in_pmsby_accident_only]
    label: likely
    status: closed
    closed_reason: PMSBY pays only for accidental death or disability; Rajesh died of an illness.
decoys: [upi_amit, electricity, bsl_premium, medical_store]

