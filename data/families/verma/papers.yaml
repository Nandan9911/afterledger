          - ["माता का नाम / Name of mother", "कमला देवी / KAMLA DEVI", mother_name]
          - ["पत्नी का नाम / Name of wife", "सुनीता वर्मा / SUNITA VERMA", spouse_name]
          - ["स्थायी पता / Permanent address", "14/2 VIKAS NAGAR, LUCKNOW 226022", address]
          - ["पंजीकरण संख्या / Registration no.", "D-2026-SYN-0480913", registration_number]
          - ["पंजीकरण तिथि / Date of registration", "{d:2026-09-08|dmy_slash}", registration_date]
