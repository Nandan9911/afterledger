# The Sato family's papers (Osaka). The banks, the shinkin bank, the insurer and the card company are
# fictional; the medical certificate of death uses a generic layout with a sample watermark. Dates
# are written for the story day 14 October 2026 (令和8年10月14日) and shift with it.
papers:
  # --------------------------------------------------------------------------------------------
  - id: death_cert
    title: 死亡診断書（写し）
    title_en: Medical certificate of death (copy)
    doc_type: death_certificate
    country: JP
    languages: [ja]
    scripts: [Jpan]
    origin: photo
    uploaded_by: p_daisuke
    uploaded_on: 2026-09-13
    template: certificate
    style: {accent: "#333333", lang: ja, size: 9.5}
    pre_title: "（デモ用の見本・合成書類）"
    pre_title_lang: ja
    titles:
      - {text: "死亡診断書", lang: ja, size: 16}
    subtitle: "この書類はAfterLedgerデモ用に作成した見本です"
    subtitle_lang: ja
    sections:
      - kv:
          - ["氏名", "佐藤 健二", deceased_name]
          - ["性別", "男", sex]
          - ["生年月日", "{d:1958-04-18|jp_era}", birth_date]
          - ["死亡したとき", "{d:2026-09-07|jp_era}　午前４時１２分", date_of_death]
          - ["死亡したところ", "大阪府大阪市北区（病院）", place_of_death]
          - ["住所", "大阪府吹田市千里山東2丁目14番7号", address]
          - ["死亡の原因", "急性心筋梗塞", cause_of_death]
          - ["診断年月日", "{d:2026-09-07|jp_era}", registration_date]
        label_w: 130
        lang: ja
    stamp: {text: "見本 SPECIMEN", round: true}
    signature: {label: "医師", name: "中村 誠"}
    note: "This is a sample document created for the AfterLedger demo. It has no legal effect."
    photo: {angle: 0.8, blur: 0.4, tint: "#F5F3EE"}
    fields:
      deceased_name: {value: 佐藤 健二}
      birth_date: {value: 1958-04-18}
      date_of_death: {value: 2026-09-07}
      place_of_death: {value: 大阪市}
      address: {value: 大阪府吹田市千里山東2丁目14番7号}

