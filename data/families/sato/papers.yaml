        - {date: 2026-05-07, narration: カード, debit: 30000}
        - {date: 2026-06-05, narration: カード, debit: 30000}
        - {date: 2026-07-03, narration: カード, debit: 30000}
        - {date: 2026-08-04, narration: カード, debit: solve}
        - {date: 2026-09-01, narration: カード, debit: 20000}
