intake:
  started_on: 2026-09-12
  by: p_daisuke
  turns:
    - role: assistant
      lang: ja
      text: このたびはご愁傷さまでございます。まず、どなたがいつお亡くなりになったか教えていただけますか。
      translation: We are very sorry for your loss. First, could you tell us who passed away, and when?
    - role: family
      person: p_daisuke
      lang: ja
      channel: text
      text: 父の佐藤健二です。9月7日に大阪の病院で亡くなりました。心筋梗塞でした。
      translation: My father, Kenji Sato. He died on 7 September in a hospital in Osaka. It was a heart attack.
    - role: assistant
      lang: ja
      text: ご家族はどなたがいらっしゃいますか。遺言書はありましたか。
      translation: Who is in the family? Was there a will?
      why: The spouse and children are the heirs under the Civil Code, and every heir signs the bank forms.
      cites: [jp_civil_887_children, jp_civil_890_spouse]
    - role: family
      person: p_daisuke
      lang: ja
      channel: text
      text: 母の恵子と、妹の由美（結婚して山田です）と私です。遺言書は見つかっていません。
      translation: My mother Keiko, my younger sister Yumi (married, now Yamada) and me. We haven't found a will.
    - role: assistant
      lang: ja
      text: 通帳や保険証券、ローンの書類などはお手元にありますか。
      translation: Do you have passbooks, insurance policies or loan papers at hand?
    - role: family
      person: p_daisuke
      lang: ja
      channel: text
      text: 浪速銀行と淀川信用金庫の通帳、みなと生命の保険証券があります。ナニワカードから請求書も届いています。
      translation: We have passbooks from Naniwa Bank and Yodogawa Shinkin and a Minato Seimei policy. A bill has also come from Naniwa Card.
  situation:
    1:
      deceased_name: 佐藤 健二
      deceased_name_en: Kenji Sato
      family_label: The Satos
      died_on: 2026-09-07
