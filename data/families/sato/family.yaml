        - {name: 山田 由美, name_en: Yumi Yamada, relationship: daughter, city: 神戸市, country: JP, languages: [ja], roles: [heir]}
      will: "no"
      unknowns: [papers at hand]
    3:
      holdings_mentioned: [浪速銀行の預金, 淀川信用金庫の預金, みなと生命の保険, ナニワカードの借入]
      papers_at_hand: [通帳2冊, 保険証券, カードの請求書]
