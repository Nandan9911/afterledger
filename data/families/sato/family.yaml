today_tasks:
  - kind: acquire
    institution_id: jp_naniwa_bank
    title: Ask Naniwa Bank and Naniwa Card for balance certificates
    body: Compare what he had in the bank with what he owed on the card loan before deciding. Any one heir can ask.
    local: {lang: ja, title: 浪速銀行とナニワカードに残高証明書を請求する, body: 預金とカードローンの残高を比べてから決めます。相続人1人で請求できます。}
  - kind: sign
    institution_id: jp_minato_seimei
    title: Claim the Minato Seimei death benefit
    body: Keiko signs and seals the claim form, and sends it with the copy of the medical certificate of death and her ID.
    local: {lang: ja, title: みなと生命の死亡保険金を請求する, body: 恵子さんが請求書に署名・押印し、死亡診断書の写しと本人確認書類を添えて送ります。}
  - kind: decide
    institution_id: jp_family_court
    title: Decide by 7 December whether to accept or renounce
    body: "The card loan may be more than his savings. Until the family decides, don't withdraw or spend his money: using it can count as accepting his debts too."
    local: {lang: ja, title: 12月7日までに、相続するか放棄するかを決める, body: カードローンの残高が預金より多いかもしれません。決めるまでは、預金を引き出したり使ったりしないでください。}
