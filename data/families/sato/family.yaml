claims:
  - id: c_naniwa
    institution_id: jp_naniwa_bank
    holdings: [h_naniwa]
    plan: JP/bank_inheritance@jp_naniwa_bank
    facts: {}
    expected_route: []
    explain:
      match: Naniwa
      summary: "Naniwa Bank pays out only once the heirs have decided to accept the inheritance. The card loan may be larger than his savings, so compare the balances first."
      summary_local: "相続するかどうかを決めてから、浪速銀行の手続きを進めます。カードローンの残高が預金より多いかもしれないので、まず残高を比べます。"
      steps:
        - step_id: ""
          who: 佐藤 大輔
          cites: [jp_heir_cert_free, jp_heir_cert_replaces]
          text: "Get certified copies of the heir information chart from the Legal Affairs Bureau. They are free and replace the bundle of family registers."
          text_local: "法定相続情報一覧図の写しを法務局でもらう。無料です。戸籍の束の代わりに使えます。"
        - step_id: submit
          who: 佐藤 大輔
          text: "Fill in Naniwa Bank's inheritance request form. A draft with furigana and seal boxes is ready; all three heirs' registered seals and seal certificates are needed."
          text_local: "浪速銀行の相続手続依頼書に記入する。フリガナと押印欄つきの下書きを用意しました。相続人3人の実印と印鑑証明書が必要です。"
        - step_id: balance_first
          who: 佐藤 大輔
          text: "Ask for a balance certificate and compare it with the card loan balance. Decide by the deadline from the result."
          text_local: "残高証明書を請求し、ローン残高と比べる。比べた結果をもとに、期限までに決めます。"
  - id: c_yodogawa
    institution_id: jp_yodogawa_shinkin
    holdings: [h_yodogawa]
    plan: JP/bank_inheritance@jp_yodogawa_shinkin
    facts: {}
    expected_route: []
  - id: c_minato
    institution_id: jp_minato_seimei
    holdings: [h_minato]
    plan: JP/life_insurance_claim@jp_minato_seimei
    facts: {beneficiary_named: "yes"}
    expected_route: [claim]
