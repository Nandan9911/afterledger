# The Tanaka family's papers (Munich, with accounts in Germany and Japan). Isarbank and Toto Bank are
# fictional; the death certificate uses a generic layout with a sample watermark. Dates are written
# for the story day 14 October 2026 and shift with it.
papers:
  # --------------------------------------------------------------------------------------------
  - id: death_cert
    title: Sterbeurkunde
    title_en: Death certificate (Germany)
    doc_type: death_certificate
    country: DE
    languages: [de]
    scripts: [Latn]
    origin: upload
    uploaded_by: p_anna
    uploaded_on: 2026-09-30
    template: certificate
    style: {accent: "#2F3E46", lang: de, size: 9}
    pre_title: "Standesamt München (Muster für die AfterLedger-Demo)"
    titles:
      - {text: "STERBEURKUNDE", size: 14}
    subtitle: "Synthetisches Testdokument · keine Urkunde"
    sections:
      - kv:
          - ["Familienname", "TANAKA", family_name]
          - ["Vornamen", "Hiroshi", given_names]
          - ["Name", "Hiroshi TANAKA", deceased_name]
          - ["Geburtsdatum", "{d:1949-11-03|dmy_dot}", birth_date]
          - ["Geburtsort", "Kyoto (Japan)", birth_place]
          - ["Staatsangehörigkeit", "japanisch", nationality]
          - ["Letzter Wohnsitz", "Leopoldstraße 112, 80804 München", address]
          - ["Sterbedatum", "{d:2026-09-24|dmy_dot}", date_of_death]
          - ["Sterbeort", "München", place_of_death]
          - ["Familienstand", "verwitwet", marital_status]
          - ["Registernummer", "S 2026/18093", registration_number]
          - ["Ausstellungsdatum", "{d:2026-09-29|dmy_dot}", registration_date]
        label_w: 160
        lang: de
    stamp: {text: "STANDESAMT · MUSTER", round: true}
    signature: {label: "Standesbeamtin", name: "K. Huber"}
    note: "This is a sample document created for the AfterLedger demo. It has no legal effect."
    fields:
      deceased_name: {value: Hiroshi TANAKA}
      birth_date: {value: 1949-11-03}
      date_of_death: {value: 2026-09-24}
      place_of_death: {value: München}
      address: {value: "Leopoldstraße 112, 80804 München"}
      nationality: {value: japanisch}

  # --------------------------------------------------------------------------------------------
  - id: rowing_club
    title: Mitgliedsbescheinigung, Ruderclub Isar
