    style: {accent: "#1F4E79", lang: de, size: 9}
    pre_title: Ruderclub Isar e.V. (Muster für die AfterLedger-Demo)
    titles:
      - {size: 14, text: MITGLIEDSBESCHEINIGUNG}
    subtitle: Synthetisches Testdokument · fiktiver Verein
    sections:
      - kv:
          - [Mitglied, Hiroshi TANAKA, member_name]
          - [Mitgliedsnummer, RCI-0417, membership_number]
          - [Mitglied seit, "{d:2004-04-12|dmy_dot}", member_since]
          - [Jahresbeitrag, "180,00 EUR", annual_fee]
          - [Bezahlt bis, "{d:2026-12-31|dmy_dot}", paid_until]
