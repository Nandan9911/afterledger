jurisdiction:
  succession_law: contested
  contested: true
  summary: "Two countries' rules disagree about which law decides who inherits. Germany follows where he lived; Japan follows his nationality. Both sources are shown, and each bank's steps are prepared; a lawyer should confirm which law applies before either bank pays."
  summary_local: "Die Regeln zweier Länder widersprechen sich, welches Recht über die Erbfolge entscheidet: Deutschland stellt auf den letzten gewöhnlichen Aufenthalt ab, Japan auf die Staatsangehörigkeit. Eine Anwältin oder ein Anwalt sollte klären, welches Recht gilt."
  findings:
    - {assertion_ids: [eu_650_art21_1], rule: "Under the EU Succession Regulation, succession as a whole follows the law of the State where he was habitually resident: Germany.", points_to: DE}
    - {assertion_ids: [jp_national_law], rule: "Japan's conflict-of-laws rule makes succession follow the law of his nationality: Japan.", points_to: JP}
  adjudication:
    contested: true
    decision: "Germany's rule points to German law and Japan's points to Japanese law. Neither is set aside here; both are shown, and a lawyer should confirm which applies."
    keep: [eu_650_art21_1, jp_national_law]
    contested_ids: [eu_650_art21_1, jp_national_law]
    reasons: "Each country's authorities apply their own conflict rule. Whether the exception for a manifestly closer connection (art. 21(2)) applies is a judgement for a lawyer."
  legs:
    - {country: DE, succession_law: contested, papers_from: [DE], certification: [], cites: [eu_650_art21_1, de_isarbank_erbschein], contested: true, note: "Isarbank usually needs a certificate of inheritance (Erbschein) or a European Certificate of Succession."}
    - {country: JP, succession_law: contested, papers_from: [DE, JP], certification: [], cites: [jp_national_law, jp_toto_foreign_signature], contested: true, note: "Toto Bank accepts a signature certificate from a Japanese consulate for heirs living abroad."}
  cites: [eu_650_art21_1, eu_650_art21_2, jp_national_law]

