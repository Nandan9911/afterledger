today_tasks:
  - kind: ask
    key_prefix: "ask:identity"
    title: Tell us who Saraswathy Amma is
    body: "His NRO account sent ₹5,000 to Saraswathy Amma every month. If she is his mother, she is a legal heir for his money in India and signs a no-objection letter."
    local: {lang: ml, title: "സരസ്വതി അമ്മ ആരാണ്?", body: "അദ്ദേഹത്തിന്റെ NRO അക്കൗണ്ടിൽ നിന്ന് എല്ലാ മാസവും സരസ്വതി അമ്മയ്ക്ക് ₹5,000 അയച്ചിരുന്നു. അവർ അദ്ദേഹത്തിന്റെ അമ്മയാണെങ്കിൽ, ഇന്ത്യയിലെ പണത്തിന് അവരും അവകാശിയാണ്."}
  - kind: certify
    institution_id: in_certifying_authority_abroad
    title: Get an apostille on the death certificate
    body: "Periyar Bank can use the Singapore death certificate only once it is certified in Singapore. The Singapore Academy of Law issues apostilles, and it is the quickest of the five ways the Reserve Bank of India accepts."
    local: {lang: ml, title: "മരണ സർട്ടിഫിക്കറ്റിന് അപ്പോസ്റ്റിൽ വാങ്ങുക", body: "സിംഗപ്പൂരിലെ മരണ സർട്ടിഫിക്കറ്റ് അവിടെ സാക്ഷ്യപ്പെടുത്തിയാൽ മാത്രമേ പെരിയാർ ബാങ്കിന് അത് ഉപയോഗിക്കാനാകൂ. സിംഗപ്പൂർ അക്കാദമി ഓഫ് ലോ അപ്പോസ്റ്റിൽ നൽകുന്നു; റിസർവ് ബാങ്ക് അംഗീകരിക്കുന്ന അഞ്ച് വഴികളിൽ ഏറ്റവും വേഗമുള്ളത് ഇതാണ്."}
  - kind: submit
    institution_id: sg_straits_marine
    title: Ask Straits Marine Engineering for his final pay
    body: "Salary to the date of death and unused leave are paid to the next of kin. HR needs the death certificate."
    local: {lang: ml, title: "അവസാന ശമ്പളത്തിനായി സ്ട്രെയിറ്റ്സ് മറൈൻ എഞ്ചിനീയറിങ്ങിനോട് ചോദിക്കുക", body: "മരണദിവസം വരെയുള്ള ശമ്പളവും ബാക്കിയുള്ള അവധിയുടെ തുകയും അടുത്ത ബന്ധുവിന് ലഭിക്കും. എച്ച്ആർ വിഭാഗത്തിന് മരണ സർട്ടിഫിക്കറ്റ് വേണം."}
