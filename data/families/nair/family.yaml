    - role: family
      person: p_lakshmi
      lang: ml
      channel: voice
      seconds: 14
      text: ഞാനും മകൻ അർജുനും. അർജുൻ സിംഗപ്പൂരിലാണ്. കൊച്ചിയിൽ പെരിയാർ ബാങ്കിൽ രണ്ട് അക്കൗണ്ടുകളുണ്ട്.
      translation: Me and our son Arjun. Arjun is in Singapore. There are two accounts at Periyar Bank in Kochi.
    - role: assistant
      lang: ml
      text: എന്തെങ്കിലും കുറിപ്പുകളോ ബാങ്ക് പേപ്പറുകളോ കയ്യിലുണ്ടോ?
