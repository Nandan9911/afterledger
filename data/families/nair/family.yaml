      lang: ml
      channel: voice
      seconds: 16
      text: എന്റെ ഭർത്താവ്, സുരേഷ് നാരായണൻ നായർ. സെപ്റ്റംബർ പതിനൊന്നിന് സിംഗപ്പൂരിൽ വെച്ച്. ഹൃദയാഘാതം ആയിരുന്നു. അവിടെ ജോലി ചെയ്യുകയായിരുന്നു.
      translation: My husband, Suresh Narayanan Nair. On 11 September, in Singapore. It was a heart attack. He was working there.
    - role: assistant
      lang: ml
      text: കുടുംബത്തിൽ ആരൊക്കെയുണ്ട്? പണത്തിന്റെ കാര്യങ്ങൾ ആരാണ് നോക്കിയിരുന്നത്?
