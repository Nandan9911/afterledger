# The Nair family's papers (Kochi and Singapore). The banks, the chit company and the employer are
# fictional; the death certificate and the CPF statement use generic layouts with a sample watermark.
# Dates are written for the story day 14 October 2026 and shift with it.
papers:
  # --------------------------------------------------------------------------------------------
  - id: death_cert
    title: Singapore death certificate
    doc_type: death_certificate
    country: SG
    languages: [en]
    scripts: [Latn]
    origin: upload
    uploaded_by: p_arjun
    uploaded_on: 2026-09-17
    template: certificate
    style: {accent: "#9B1C1C", lang: en, size: 9}
    pre_title: "Republic of Singapore · Registry of Births and Deaths (sample specimen)"
    titles:
      - {text: "CERTIFICATE OF DEATH", size: 13}
    subtitle: "Specimen for the AfterLedger demo · Not an official record"
    sections:
      - kv:
          - ["Name of deceased", "SURESH NARAYANAN NAIR", deceased_name]
          - ["Identification no.", "G0000417Z (FIN)", id_number]
          - ["Sex", "Male", sex]
          - ["Age", "54 years", age]
          - ["Date of death", "{d:2026-09-11|dmy_slash}", date_of_death]
          - ["Place of death", "Residence, Tampines, Singapore", place_of_death]
          - ["Nationality", "Indian", nationality]
          - ["Cause of death", "Ischaemic heart disease", cause_of_death]
          - ["Informant", "ARJUN SURESH NAIR, son", informant]
          - ["Registration no.", "SYN-D-2026-117044", registration_number]
          - ["Date of registration", "{d:2026-09-12|dmy_slash}", registration_date]
        label_w: 180
    stamp: {text: "REGISTRAR · SPECIMEN", round: true}
    signature: {label: "Registrar of Deaths", name: "T. W. Lim"}
    note: "This is a sample document created for the AfterLedger demo. It has no legal effect."
    fields:
      deceased_name: {value: SURESH NARAYANAN NAIR}
      id_number: {value: G0000417Z}
      date_of_death: {value: 2026-09-11}
      place_of_death: {value: Singapore}
      registration_number: {value: SYN-D-2026-117044}
      registration_date: {value: 2026-09-12}

