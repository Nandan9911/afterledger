# The Morales family's papers (San Antonio, Texas). The bank, the insurer and the employer are
# fictional; the death certificate uses a generic layout with a sample watermark. Dates are written
# for the story day 14 October 2026 and shift with it.
papers:
  # --------------------------------------------------------------------------------------------
  - id: death_cert
    title: Death certificate (certified copy)
    doc_type: death_certificate
    country: US
    languages: [en]
    scripts: [Latn]
    origin: photo
    uploaded_by: p_daniel
    uploaded_on: 2026-09-16
    template: certificate
    style: {accent: "#2C3E50", lang: en, size: 9}
    pre_title: "State of Texas · Certified copy of a death record (sample specimen)"
    titles:
      - {text: "CERTIFICATE OF DEATH", size: 13}
    subtitle: "Specimen for the AfterLedger demo · Not a vital record"
    sections:
      - kv:
          - ["1. Decedent's legal name", "JOSE LUIS MORALES", deceased_name]
          - ["2. Sex", "Male", sex]
          - ["3. Date of birth", "{d:1955-03-04|mdy_slash}", birth_date]
          - ["4. Date of death", "{d:2026-09-09|mdy_slash}", date_of_death]
          - ["5. Place of death", "Decedent's home, San Antonio, Bexar County, Texas", place_of_death]
          - ["6. Usual residence", "1418 Calle Ocotillo, San Antonio, TX 78228", address]
          - ["7. Marital status", "Married", marital_status]
          - ["8. Surviving spouse", "MARIA ELENA MORALES", spouse_name]
          - ["9. Informant", "MARIA ELENA MORALES, wife", informant]
          - ["10. Cause of death", "Acute myocardial infarction", cause_of_death]
          - ["11. Manner of death", "Natural", manner_of_death]
          - ["State file number", "SYN-142-2026-088317", registration_number]
          - ["Date filed", "{d:2026-09-14|mdy_slash}", registration_date]
        label_w: 190
    stamp: {text: "REGISTRAR · SPECIMEN", round: true}
    signature: {label: "Local registrar", name: "A. Villarreal"}
    note: "This is a sample document created for the AfterLedger demo. It is not a vital record and has no legal effect."
    photo: {angle: 1.1, blur: 0.4, tint: "#F2F4F6"}
    fields:
      deceased_name: {value: JOSE LUIS MORALES}
      birth_date: {value: 1955-03-04}
      date_of_death: {value: 2026-09-09}
      place_of_death: {value: San Antonio}
      spouse_name: {value: MARIA ELENA MORALES}
      registration_date: {value: 2026-09-14}

