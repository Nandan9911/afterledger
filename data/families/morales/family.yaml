qa:
  - match: ["devolver el dinero del seguro social", "seguro social que llego", "tengo que devolver"]
    question: ¿Tengo que devolver el dinero del Seguro Social que llegó este mes?
    question_en: Do I have to give back the Social Security money that arrived this month?
    lang: es
    answer: "Sí. El Seguro Social no paga el mes en que fallece la persona. El pago que llegó en octubre corresponde a septiembre, así que hay que devolverlo. No lo gaste. Usted también puede pedir el pago único de $255 y los beneficios de sobreviviente. Ya están en su plan."
    answer_en: "Yes. Social Security is not paid for the month in which the beneficiary dies. The payment that arrived in October is for September, so it must be returned. Do not spend it. You can also ask for the $255 lump-sum death payment and survivor benefits; they are already in your plan."
    sources: [us_ssa_month_of_death, us_ssa_return, us_ssa_255]
    grounded_on: ["The October payment of $1,612.00 arrived on 14 October, after his death on 9 September."]
    follow_ups: ["¿Cómo devuelvo el pago?"]
  - match: ["401(k)", "401k", "de su trabajo"]
    question: Mom, pregúntale lo del 401(k) de su trabajo.
    question_en: Mom, ask about the 401(k) from his work.
    lang: es
    answer: "Claro. Su último sueldo llegó el 30 de septiembre. Preparé tres preguntas para su empleador: el plan 401(k), el seguro de vida del grupo y el pago final. ¿Quiere oírlas?"
    answer_en: "Of course. His final paycheck arrived on 30 September. I prepared three questions for his employer: the 401(k) plan, the group life insurance and the final pay. Would you like to hear them?"
    sources: [us_riverwalk_benefits, us_riverwalk_direct]
    grounded_on: ["RIVERWALK LOGISTICS FINAL PAY, $1,846.15 on 30 September."]
    follow_ups: ["Sí, quiero oírlas."]

