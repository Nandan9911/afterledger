intake:
  started_on: 2026-09-15
  by: p_maria
  turns:
    - role: assistant
      lang: es
      text: Lo siento mucho por su pérdida. Para empezar, ¿quién falleció y cuándo?
      translation: I'm so sorry for your loss. To start, who died, and when?
    - role: family
      person: p_maria
      lang: es
      channel: voice
      seconds: 12
      text: Mi esposo, José Luis Morales. Falleció el 9 de septiembre en la casa, aquí en San Antonio. Fue el corazón.
      translation: My husband, José Luis Morales. He died on 9 September at home, here in San Antonio. It was his heart.
    - role: assistant
      lang: es
      text: Gracias, señora. ¿Dejó testamento? ¿Y quiénes son sus hijos?
      translation: Thank you. Did he leave a will? And who are his children?
      why: Without a will, Texas law decides who inherits, and a small estate may not need a court-appointed executor.
      cites: [us_tx_sea_intestate]
    - role: family
      person: p_maria
      lang: es
      channel: voice
      seconds: 15
      text: No, no dejó testamento. Tenemos dos hijos, Daniel, que vive aquí cerca, y Lucía, en Houston.
      translation: No, he didn't leave a will. We have two children, Daniel, who lives close by, and Lucía, in Houston.
    - role: assistant
      lang: es
      text: ¿Tiene papeles del banco, del seguro o de su trabajo?
      translation: Do you have papers from the bank, the insurance or his work?
    - role: family
      person: p_maria
      lang: es
      channel: voice
      seconds: 11
      text: Daniel tiene los estados de cuenta del Mission River Bank. José Luis trabajaba medio tiempo en Riverwalk Logistics.
      translation: Daniel has the Mission River Bank statements. José Luis worked part-time at Riverwalk Logistics.
