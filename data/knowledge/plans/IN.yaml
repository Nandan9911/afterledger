    level: gold
    verified_on: 2026-10-14
    variables:
      - name: member_paid_premium
        type: tri
        question: Was the PMJJBY premium of ₹436 debited from his account this year?
        derive: lead_evidence:pmjjby
        cites: [in_pmjjby_premium]
      - name: within_age
        type: tri
        derive: pmjjby_age_ok
        question: Did he join before 50 and was he under 55 when he died?
        cites: [in_pmjjby_age]
    documents:
      - id: bank_claim_form
        name: The PMJJBY claim form from the bank branch, signed by the nominee
        signed_by: [nominee]
        cites: [in_pmjjby_claim_30_days, in_sahyadri_pmjjby_branch]
      - id: death_cert
        name: Death certificate
        cites: [in_pmjjby_claim_30_days]
    clocks:
      - id: bank_7
        short: claim reaches the insurer
        ends_on: forwarded_to_insurer
        label: The bank sends the completed claim to the insurer within 7 days
        owner: institution
        starts_on: claim_lodged
        length: 7
        unit: calendar_days
        cites: [in_pmjjby_bank_7_days]
      - id: insurer_7
        short: pays the claim
        label: The insurer approves and pays within 7 days after that
        owner: institution
        starts_on: forwarded_to_insurer
        length: 7
        unit: calendar_days
        cites: [in_pmjjby_insurer_7_days]
      - id: claim_30
        short: "claim, preferably by now"
        ends_on: claim_lodged
        label: Claim preferably within 30 days of the death
        owner: family
        starts_on: death
        length: 30
        unit: calendar_days
        notes: A preference, not a cut-off; later claims are made the same way.
        cites: [in_pmjjby_claim_30_days]
    steps:
      - id: claim
        kind: submit
        actor: family
        text: The nominee claims ₹2 lakh at the bank branch where the account is held, preferably within 30 days of the death.
        when: member_paid_premium = yes and within_age = yes
        documents: [bank_claim_form, death_cert]
        clocks: [claim_30, bank_7]
        cites: [in_pmjjby_cover, in_pmjjby_claim_30_days, in_sahyadri_pmjjby_branch]
      - id: not_covered
        kind: handoff
        actor: agent
        text: The cover was not in force, so there is nothing to claim under PMJJBY.
        when: member_paid_premium = no or within_age = no
        cites: [in_pmjjby_premium, in_pmjjby_age]
      - id: forward
        kind: wait
        actor: institution
        text: The bank forwards the claim to the insurer within 7 days, and the insurer pays within 7 days after that.
        clocks: [bank_7, insurer_7]
        after: [claim]
        cites: [in_pmjjby_bank_7_days, in_pmjjby_insurer_7_days]
    compiled_from: [in_pmjjby_cover, in_pmjjby_premium, in_pmjjby_age, in_pmjjby_claim_30_days, in_pmjjby_bank_7_days,
                    in_pmjjby_insurer_7_days]

