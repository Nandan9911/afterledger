  # ===============================================================================================
  - key: IN/life_insurance_claim
    title: A life insurance death claim (IRDAI rules)
    jurisdiction: IN
    institution_kind: insurer
    holding_kinds: [life_policy]
    level: gold
    verified_on: 2026-10-14
    variables:
      - name: investigation
        type: tri
        question: Has the insurer said it is investigating the claim?
        derive: claim_flag:investigation
        cites: [in_irdai_15_days, in_irdai_45_days]
      - name: nominee_named
        type: tri
        question: Is a nominee named on the policy?
        derive: holding_nominee
        cites: [in_bsl_documents]
    documents:
      - id: claim_form
        name: The insurer's death claim form
        signed_by: [nominee]
        cites: [in_bsl_documents]
      - id: death_cert
        name: Death certificate
        cites: [in_bsl_documents]
      - id: policy_document
        name: The policy document
        cites: [in_bsl_documents]
      - id: nominee_id
        name: The nominee's identity proof
        cites: [in_bsl_documents]
      - id: cancelled_cheque
        name: A cancelled cheque for the account to be paid into
        cites: [in_bsl_documents]
    clocks:
      - id: settle_15
        short: decides the policy claim
        label: The insurer settles within 15 days of being told of the claim
        owner: institution
        starts_on: claim_intimated
        length: 15
        unit: calendar_days
        compensation: rate_per_year_from_start
        compensation_params: {base_rate: in_bank_rate, base_rate_on: clock_start, spread_pct: "2"}
        notes: Once late, interest at the bank rate plus 2% runs from the date of intimation till payment. The circular does not say on which day the bank rate is taken; the tracker uses the rate on the day of intimation and says so.
        when: investigation != yes
        cites: [in_irdai_15_days, in_irdai_interest]
      - id: settle_45
        short: decides the policy claim
        label: With an investigation, the insurer settles within 45 days of being told
        owner: institution
        starts_on: claim_intimated
        length: 45
        unit: calendar_days
        compensation: rate_per_year_from_start
        compensation_params: {base_rate: in_bank_rate, base_rate_on: clock_start, spread_pct: "2"}
        when: investigation = yes
        cites: [in_irdai_45_days, in_irdai_interest]
    steps:
      - id: claim
        kind: submit
        actor: family
        text: The nominee sends the claim form, the death certificate, the policy, their identity proof and a cancelled cheque.
        documents: [claim_form, death_cert, policy_document, nominee_id, cancelled_cheque]
        clocks: [settle_15]
        cites: [in_bsl_documents, in_irdai_15_days]
      - id: no_rejection_for_delay
        kind: info
        actor: agent
        text: The insurer may not reject or close the claim because papers or the intimation came late.
        cites: [in_irdai_no_rejection_delay]
      - id: decision
        kind: wait
        actor: institution
        text: The insurer settles within 15 days of being told, or 45 days if the claim needs investigating.
        clocks: [settle_15, settle_45]
        after: [claim]
        cites: [in_irdai_15_days, in_irdai_45_days]
      - id: chase_late
        kind: follow_up
        actor: family
        text: If the insurer is late, it owes interest at the bank rate plus 2% from the day it was told until it pays.
        clocks: [settle_15, settle_45]
        after: [decision]
        cites: [in_irdai_interest]
    compiled_from: [in_irdai_15_days, in_irdai_45_days, in_irdai_interest, in_irdai_no_rejection_delay, in_bsl_documents]
    notes: The documents come from Bharat Suraksha Life's own page; another insurer's list is researched when needed.

