  - key: IN/foreign_death_certificate
    authority: in_certifying_authority_abroad
    title: Getting a death certificate from abroad accepted in India
    jurisdiction: IN
    institution_kind: government
    holding_kinds: []
    level: gold
    verified_on: 2026-10-14
    variables:
      - name: issuing_in_english
        type: tri
        derive: paper_language_is:death_certificate:en
        question: Is the death certificate in English?
        cites: [in_sebi_translation]
      - name: certification_mode
        type: choice
        options: [apostille, indian_bank_branch, notary, consulate]
        question: The certificate can be certified by apostille, by an Indian bank's branch in that country, by a notary or court there, or by the Indian embassy or consulate. Which is easiest for you?
        cites: [in_rbi_324_foreign_death, in_rbi_324_apostille, in_rbi_324_overseas_branch, in_rbi_324_notary, in_rbi_324_consular]
      - name: issuing_country
        type: text
        derive: death_country
        cites: [in_rbi_324_foreign_death]
    documents:
      - id: foreign_death_cert
        name: The death certificate issued abroad
        certification: [original]
        cites: [in_rbi_324_foreign_death]
      - id: english_translation
        name: A self-certified English translation
        certification: [translation]
        when: issuing_in_english = no
        cites: [in_sebi_translation]
    clocks: []
    steps:
      - id: choose_mode
        kind: decide
        actor: family
        text: Choose how to certify the certificate in the country that issued it.
        decides: certification_mode
        cites: [in_rbi_324_foreign_death, in_sebi_foreign_death]
      - id: apostille
        kind: certify
        actor: family
        text: Get an apostille on the death certificate from the competent authority of the issuing country.
        when: certification_mode = apostille
        documents: [foreign_death_cert]
        after: [choose_mode]
        cites: [in_rbi_324_apostille]
      - id: bank_branch
        kind: certify
        actor: family
        text: Ask an authorised official at an Indian scheduled commercial bank's branch in that country to certify it.
        when: certification_mode = indian_bank_branch
        documents: [foreign_death_cert]
        after: [choose_mode]
        cites: [in_rbi_324_overseas_branch]
      - id: notary
        kind: certify
        actor: family
        text: Have it certified by a court magistrate, judge or notary public in that country.
        when: certification_mode = notary
        documents: [foreign_death_cert]
        after: [choose_mode]
        cites: [in_rbi_324_notary]
      - id: consulate
        kind: certify
        actor: family
        text: Have it consularised by the Indian embassy or consulate in that country.
        when: certification_mode = consulate
        documents: [foreign_death_cert]
        after: [choose_mode]
        cites: [in_rbi_324_consular]
      - id: translate
        kind: acquire
        actor: family
        text: Add a self-certified English translation, because the certificate is not in English.
        when: issuing_in_english = no
        documents: [english_translation]
        cites: [in_sebi_translation]
      - id: use_it
        kind: submit
        actor: family
        text: Use the certified certificate in every Indian claim in place of an Indian death certificate.
        documents: [foreign_death_cert, english_translation]
        cites: [in_rbi_324_foreign_death, in_sebi_foreign_death]
    compiled_from: [in_rbi_324_foreign_death, in_rbi_324_apostille, in_sebi_foreign_death, in_sebi_translation]

