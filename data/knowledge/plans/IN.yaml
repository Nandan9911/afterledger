  - key: IN/chit_fund@in_periyar_chits
    title: A chit fund membership at Periyar Chits
    jurisdiction: IN
    institution_kind: chit_fund
    holding_kinds: [chit_fund]
    level: dual_verified
    verified_on: 2026-10-14
    variables:
      - name: bid_taken
        type: tri
        question: Had he already received the chit amount by bidding?
        cites: [in_periyar_chits_heirs, in_periyar_chits_after_bid]
      - name: continue_chit
        type: choice
        options: [continue, refund]
        question: Would the family like to keep paying into the chit, or take back what he paid in, less the foreman's commission?
        cites: [in_periyar_chits_heirs]
    documents:
      - id: death_cert
        name: Copy of the death certificate
        cites: [in_periyar_chits_documents]
      - id: chit_passbook
        name: His chit passbook
        cites: [in_periyar_chits_documents]
      - id: request_letter
        name: Letter telling Periyar Chits of the death and the family's choice
        cites: [in_periyar_chits_heirs]
    clocks: []
    steps:
      - id: choose
        kind: decide
        actor: family
        text: Decide whether to continue the chit or receive what he paid in, less the foreman's commission.
        when: bid_taken = no
        decides: continue_chit
        cites: [in_periyar_chits_heirs]
      - id: tell_branch
        kind: submit
        actor: family
        text: Tell the Periyar Chits branch of the death, with the certificate, his passbook and the family's choice.
        when: bid_taken = no
        documents: [death_cert, chit_passbook, request_letter]
        after: [choose]
        cites: [in_periyar_chits_heirs, in_periyar_chits_documents]
      - id: statement_after_bid
        kind: handoff
        actor: institution
        text: He had already received the chit amount, so the remaining subscriptions are recovered from the estate. Ask Periyar Chits for a statement.
        when: bid_taken = yes
        documents: [death_cert, chit_passbook]
        cites: [in_periyar_chits_after_bid, in_periyar_chits_documents]
    notes: From Periyar Chits' own page (a fictional institution in the demo).

