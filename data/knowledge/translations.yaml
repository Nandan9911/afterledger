    ml: "രണ്ട് രാജ്യങ്ങളിലെ സ്വത്തുക്കൾ; നോമിനേഷനില്ലാത്ത CPF; കൈകൊണ്ടെഴുതിയ മലയാളം കുറിപ്പുകൾ വായിച്ച് സ്ഥിരീകരിച്ചു"
    ar: "أصول في بلدين؛ وحساب CPF بلا مستفيد مسمّى؛ وملاحظات مكتوبة بخط اليد بالمالايالامية قُرئت وتأكدت"
