  - en: "The value of the mutual fund units bought every month at CAMS. Shows which fund the ₹5,000 went to."
    hi: "CAMS के ज़रिए हर महीने खरीदी गई म्यूचुअल फ़ंड यूनिटों का मूल्य। इससे पता चलेगा कि ₹5,000 किस फ़ंड में गए।"
  - en: "Shares in Gomti Paper Mills, probably on paper certificates."
    hi: "गोमती पेपर मिल्स के शेयर, शायद कागज़ी प्रमाणपत्रों के रूप में।"

  # The Sato family's plan at Naniwa Bank, in Japanese
  - en: "Each heir decides within three months of learning the inheritance opened for them"
    ja: "各相続人は、自分のために相続が開始したことを知った時から3か月以内に決めます"
  - en: "Naniwa Bank completes the procedure about two weeks after it has every paper"
    ja: "浪速銀行は、書類がすべてそろってから約2週間で手続きを完了します"
  - en: "Any one heir can ask for a balance certificate now, without starting the procedure."
    ja: "相続人のうち1人が、手続きを始めなくても今すぐ残高証明書を請求できます。"
  - en: "Start the transfer only after the heirs have decided to accept; taking the money first can count as accepting his debts too."
