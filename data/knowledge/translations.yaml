  # The Verma family's Today page, in Hindi
  - en: "Narmada Bank settlement"
    hi: "नर्मदा बैंक का निपटान"
  - en: "Bharat Suraksha Life decides the policy claim"
    hi: "भारत सुरक्षा लाइफ़ पॉलिसी के दावे पर फ़ैसला करेगी"
  - en: "The insurer settles within 15 days of being told of the claim"
