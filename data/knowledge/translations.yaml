# Reviewed translations for offline runs. Live runs use Cloud Translation, and every family copy of a
# letter is back-translated and compared before it is shown.
#
# The offline translator looks a text up whole, then paragraph by paragraph, then line by line (a list item
# keeps its "- " marker; "form - name" is looked up part by part). A letter is translated only when every
# piece is here; otherwise the family copy is left out and the pack says a live run will make it.
#
# Keys are matched after normalising (NFKC, case, spaces and line breaks), so a paragraph entry also
# matches the same words broken over different lines. Numbers, dates and amounts must be copied exactly:
# the letter checks compare them.
entries:
  # ---- a contested succession law: code's words, so no model decides it ---------------------------
  - en: "The rules of Germany and Japan disagree about which law decides who inherits. Both sources are shown, and each institution's steps are prepared; a lawyer should confirm which law applies before any institution pays."
    de: "Die Regeln Deutschlands und Japans widersprechen sich darin, welches Recht über die Erbfolge entscheidet. Beide Quellen werden gezeigt, und die Schritte für jede Stelle sind vorbereitet; eine Anwältin oder ein Anwalt sollte klären, welches Recht gilt, bevor eine Stelle auszahlt."
  - en: "The rules of Germany and Japan point to different laws for who inherits. Neither is set aside here: both are shown, and a lawyer should confirm which applies."
    de: "Die Regeln Deutschlands und Japans verweisen für die Erbfolge auf unterschiedliches Recht. Keine wird hier beiseitegeschoben: Beide werden gezeigt, und eine Anwältin oder ein Anwalt sollte klären, welches gilt."
  # ---- shared letter lines ----------------------------------------------------------------------
  - en: "I enclose the papers for this claim:"
    hi: "इस दावे के काग़ज़ात संलग्न हैं:"
    ml: "ഈ ക്ലെയിമിനുള്ള രേഖകൾ ഇതോടൊപ്പം ചേർക്കുന്നു:"
    es: "Adjunto los documentos de esta reclamación:"
  - en: "Please confirm in writing when you have every paper, so that the time for settling the claim can be counted from that day."
    hi: "कृपया सभी काग़ज़ात मिल जाने पर लिखित में पुष्टि करें, ताकि दावे के निपटान का समय उसी दिन से गिना जा सके।"
    ml: "എല്ലാ രേഖകളും ലഭിച്ചുകഴിഞ്ഞാൽ ദയവായി അത് രേഖാമൂലം സ്ഥിരീകരിക്കുക; ക്ലെയിം തീർപ്പാക്കാനുള്ള സമയം ആ ദിവസം മുതൽ കണക്കാക്കാനാണിത്."
    es: "Les ruego que me confirmen por escrito cuando tengan todos los documentos, para que el plazo para resolver la reclamación se cuente a partir de ese día."
  - en: "Please tell me in writing what you still need to settle this claim."
    hi: "कृपया मुझे लिखित में बताएँ कि इस दावे के निपटान के लिए आपको और क्या चाहिए।"
    ml: "ഈ ക്ലെയിം തീർപ്പാക്കാൻ ഇനി എന്താണ് വേണ്ടതെന്ന് ദയവായി രേഖാമൂലം അറിയിക്കുക."
    es: "Les ruego que me indiquen por escrito qué más necesitan para resolver esta reclamación."
  - en: "Dear Sir or Madam,"
    hi: "महोदय/महोदया,"
    ml: "ബഹുമാനപ്പെട്ട സർ/മാഡം,"
    es: "Estimados señores:"
  - en: "Yours faithfully,"
    hi: "भवदीय,"
    ml: "എന്ന് വിശ്വസ്തതയോടെ,"
    es: "Atentamente,"
  - en: "Sincerely,"
    hi: "भवदीय,"
    ml: "എന്ന് വിശ്വസ്തതയോടെ,"
    es: "Atentamente,"

  # ---- papers named in covering letters -----------------------------------------------------------
  - en: "Death certificate"
    hi: "मृत्यु प्रमाण पत्र"
    ml: "മരണ സർട്ടിഫിക്കറ്റ്"
    es: "Certificado de defunción"
  - en: "Claim form for accounts with a nominee or survivorship clause (RBI Annex V)"
    hi: "नामिती या उत्तरजीविता खंड वाले खातों के लिए दावा फ़ॉर्म (RBI अनुलग्नक V)"
    ml: "നോമിനിയോ സർവൈവർഷിപ്പ് വ്യവസ്ഥയോ ഉള്ള അക്കൗണ്ടുകൾക്കുള്ള ക്ലെയിം ഫോം (RBI അനുബന്ധം V)"
  - en: "Claim form for accounts without a nominee (RBI Annex VI)"
    hi: "बिना नामिती वाले खातों के लिए दावा फ़ॉर्म (RBI अनुलग्नक VI)"
    ml: "നോമിനി ഇല്ലാത്ത അക്കൗണ്ടുകൾക്കുള്ള ക്ലെയിം ഫോം (RBI അനുബന്ധം VI)"
  - en: "Bond of indemnity (RBI Annex VII)"
    hi: "क्षतिपूर्ति बंधपत्र (RBI अनुलग्नक VII)"
    ml: "ഇൻഡെംനിറ്റി ബോണ്ട് (RBI അനുബന്ധം VII)"
  - en: "Letter of disclaimer or no objection (RBI Annex VIII)"
    hi: "अधित्याग या अनापत्ति पत्र (RBI अनुलग्नक VIII)"
    ml: "അവകാശം ഒഴിയുന്നതിനോ എതിർപ്പില്ലെന്ന് അറിയിക്കുന്നതിനോ ഉള്ള കത്ത് (RBI അനുബന്ധം VIII)"
  - en: "Declaration about the legal heirs by an independent person (RBI Annex IX)"
    hi: "किसी स्वतंत्र व्यक्ति द्वारा कानूनी वारिसों के बारे में घोषणा (RBI अनुलग्नक IX)"
    ml: "നിയമപരമായ അവകാശികളെക്കുറിച്ച് ഒരു സ്വതന്ത്ര വ്യക്തി നൽകുന്ന പ്രസ്താവന (RBI അനുബന്ധം IX)"
  - en: "The claimant's identity and address document (an officially valid document)"
    hi: "दावेदार की पहचान और पते का दस्तावेज़ (आधिकारिक रूप से मान्य दस्तावेज़)"
    ml: "ക്ലെയിം ചെയ്യുന്നയാളുടെ തിരിച്ചറിയൽ രേഖയും വിലാസ രേഖയും (ഔദ്യോഗികമായി സാധുവായ രേഖ)"
  - en: "Foreign death certificate, certified in the country that issued it"
    hi: "विदेश में जारी मृत्यु प्रमाण पत्र, उसी देश में प्रमाणित"
    ml: "വിദേശത്ത് നൽകിയ മരണ സർട്ടിഫിക്കറ്റ്, അത് നൽകിയ രാജ്യത്തുതന്നെ സാക്ഷ്യപ്പെടുത്തിയത്"
  - en: "The PMJJBY claim form from the bank branch, signed by the nominee"
    hi: "बैंक शाखा से मिला PMJJBY दावा फ़ॉर्म, नामिती के हस्ताक्षर सहित"
  - en: "The insurer's death claim form"
    hi: "बीमा कंपनी का मृत्यु दावा फ़ॉर्म"
  - en: "The policy document"
    hi: "पॉलिसी दस्तावेज़"
  - en: "The nominee's identity proof"
    hi: "नामिती का पहचान प्रमाण"
  - en: "A cancelled cheque for the account to be paid into"
    hi: "जिस खाते में भुगतान होना है, उसका रद्द किया हुआ चेक"
  - en: "Transmission request form (SEBI Annexure-3)"
    hi: "ट्रांसमिशन अनुरोध फ़ॉर्म (SEBI अनुलग्नक-3)"
  - en: "Indemnity bond for transmission (SEBI Annexure-4)"
    hi: "ट्रांसमिशन के लिए क्षतिपूर्ति बंधपत्र (SEBI अनुलग्नक-4)"
  - en: "Affidavit-cum-no-objection from all legal heirs (SEBI Annexure-5)"
    hi: "सभी कानूनी वारिसों का शपथ-पत्र सह अनापत्ति (SEBI अनुलग्नक-5)"
  - en: "Declaration that both spellings name the same person"
    hi: "घोषणा कि दोनों वर्तनियाँ एक ही व्यक्ति का नाम हैं"
    ml: "രണ്ട് എഴുത്തുരീതികളും ഒരേ വ്യക്തിയുടെ പേരാണെന്ന പ്രസ്താവന"
    es: "Declaración de que las dos formas de escribir el nombre corresponden a la misma persona"
