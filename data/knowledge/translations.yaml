  - en: "Holdings in two countries; CPF with no nomination; handwritten Malayalam notes read and confirmed"
    hi: "दो देशों में संपत्तियाँ; बिना नॉमिनेशन का CPF; हाथ से लिखे मलयालम नोट पढ़े और पक्के किए गए"
