  - {en: "German", hi: "जर्मन", ja: "ドイツ語", es: "Alemán", ml: "ജർമ്മൻ", ar: "الألمانية"}
  - en: "Two countries' laws disagree about who inherits. AfterLedger says so, shows both sources, and still prepares each bank's steps"
    hi: "दो देशों के क़ानून इस पर अलग बात कहते हैं कि वारिस कौन है। AfterLedger यह साफ़ बताता है, दोनों स्रोत दिखाता है, और फिर भी हर बैंक के कदम तैयार करता है"
    ja: "相続人が誰かについて2か国の法律が食い違っています。AfterLedgerはそのことを伝え、両方の出典を示したうえで、銀行ごとの手順を用意します"
    es: "Las leyes de dos países no coinciden sobre quién hereda. AfterLedger lo dice, muestra ambas fuentes y aun así prepara los pasos de cada banco"
    ml: "ആരാണ് അവകാശി എന്നതിൽ രണ്ട് രാജ്യങ്ങളുടെ നിയമങ്ങൾ യോജിക്കുന്നില്ല. AfterLedger അത് തുറന്നു പറയുന്നു, രണ്ട് ഉറവിടങ്ങളും കാണിക്കുന്നു, എന്നിട്ടും ഓരോ ബാങ്കിന്റെയും ഘട്ടങ്ങൾ തയ്യാറാക്കുന്നു"
    ar: "تختلف قوانين بلدين حول من يرث. يقول AfterLedger ذلك صراحةً، ويعرض المصدرين، ومع ذلك يُعدّ خطوات كل بنك"

