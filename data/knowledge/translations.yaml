  - en: "Claim for the PMJJBY life cover of ₹2,00,000 of the late Rajesh Kumar Verma"
    hi: "स्वर्गीय राजेश कुमार वर्मा के ₹2,00,000 के PMJJBY जीवन बीमा कवर के लिए दावा"
