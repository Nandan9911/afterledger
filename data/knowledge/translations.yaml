  - en: "If Sahyadri Bank has not replied within 30 days of a written complaint, or its reply does not settle it, the complaint can go to the RBI Ombudsman within 90 days, online at cms.rbi.org.in."
    hi: "अगर सह्याद्रि बैंक लिखित शिकायत के 30 दिन के भीतर जवाब न दे, या उसके जवाब से बात न सुलझे, तो शिकायत 90 दिन के भीतर आरबीआई लोकपाल के पास जा सकती है, ऑनलाइन cms.rbi.org.in पर।"

