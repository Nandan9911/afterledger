  - en: "Claim for the late Rajesh Kumar Verma"
    hi: "स्वर्गीय राजेश कुमार वर्मा से संबंधित दावा"
  - en: "Claim for the deposits of the late Rajesh Kumar Verma, savings account ending 0932 and fixed deposit ending 2215"
    hi: "स्वर्गीय राजेश कुमार वर्मा की जमाराशियों के लिए दावा: बचत खाता (अंतिम अंक 0932) और सावधि जमा (अंतिम अंक 2215)"
  - en: "On 24 September 2026 you confirmed that you had received every document for this claim. Paragraph 319 of the Reserve Bank of India's Responsible Business Conduct Directions required the claim to be settled within 15 calendar days, by 9 October 2026. It has not been settled."
    hi: "24 सितंबर 2026 को आपने पुष्टि की थी कि इस दावे के सभी दस्तावेज़ आपको मिल गए हैं। भारतीय रिज़र्व बैंक के उत्तरदायी व्यावसायिक आचरण निदेशों (Responsible Business Conduct Directions) के पैराग्राफ़ 319 के अनुसार दावे का निपटान 15 कैलेंडर दिनों के भीतर, यानी 9 अक्टूबर 2026 तक, होना था। इसका निपटान नहीं हुआ है।"
  - en: "Under paragraph 321, compensation is due for the delay at not less than the Bank Rate plus 4 per cent a year on ₹6,41,870.00. At the Bank Rate of 5.50 per cent on 24 September 2026, this is ₹167.06 a day, or ₹835.31 up to 14 October 2026."
    hi: "पैराग्राफ़ 321 के अनुसार, इस देरी के लिए ₹6,41,870.00 पर कम से कम बैंक दर से 4 प्रतिशत वार्षिक अधिक की दर से मुआवज़ा देय है। 24 सितंबर 2026 को बैंक दर 5.50 प्रतिशत थी; इस हिसाब से यह ₹167.06 प्रतिदिन है, यानी 14 अक्टूबर 2026 तक ₹835.31।"
  - en: "Please settle the claim with this compensation, or tell me the reason for the delay in writing."
    hi: "कृपया इस मुआवज़े के साथ दावे का निपटान करें, या देरी का कारण मुझे लिखित में बताएँ।"
  - en: "Yours faithfully,\nSunita Verma"
    hi: "भवदीया,\nसुनीता वर्मा"
  - en: "Sunita Verma"
    hi: "सुनीता वर्मा"
  - en: "Amit Verma"
    hi: "अमित वर्मा"
  - en: "Kamla Devi"
    hi: "कमला देवी"

