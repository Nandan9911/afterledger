  excerpt: true
  text: 'No claim shall be rejected or closed for want of documents or for delayed intimation of claim.


    2 Processing of claim and Turn Around Time (TAT) for settlement of claims


    1. Claim intimation received by the insurers shall be processed and settled within timelines specified as under:


    S. No. | Particulars | Times lines for settlement of claims

    1. | Death claim, except in cases warranting investigation | Within 15 days from the date of intimation of claim.

    2. | Death claim warranting investigation | Within 45 days from the date of intimation of claim.

    3. | Surrender, partial withdrawal | Within 7 days of receipt of request.

    4. | Maturity Benefits, Survival benefits, Annuity payouts, Income benefits etc. | On due date.


    2. In case the claim is not settled within the specified timelines, then the claimant is entitled for interest at bank rate plus 2 percent from the date of receipt of intimation till the date of payment. Such interest shall be paid by the insurers suo-moto along with the claim amount.'
