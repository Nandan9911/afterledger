    publisher: Aire Valley Bank (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: GB
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      You can tell us about a death through the Death Notification Service or at any branch.
      If the total held with us is £50,000 or less, we can usually release the money without a grant of probate.
      We will need the death certificate, the will if there is one, and identification for the executor or next of kin.
      We aim to release funds within 10 working days of receiving everything we need.

