    lang: ja
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: JP
    fictional: true
    text: |
      このページはAfterLedgerのデモ用に作成した架空の銀行のものです。
      相続のお手続きには、相続手続依頼書、法定相続情報一覧図の写しまたは被相続人の出生から死亡までの戸籍謄本、相続人全員の印鑑証明書、通帳とキャッシュカードが必要です。
      相続手続依頼書には相続人全員が署名し、実印を押印してください。
      残高証明書は相続人のお一人からのご請求で発行します。
      書類がそろってから約2週間でお手続きが完了します。

