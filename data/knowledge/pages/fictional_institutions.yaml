# Pages of the demo's fictional institutions. Every one is invented for AfterLedger's synthetic
# families, sits on a reserved .example domain and says so. They let the demo show research on
# an institution's own rules (source tier 2) without imitating any real bank or insurer.
pages:
  - url: https://www.sahyadri-bank.example/bereavement
    title: Sahyadri Bank - Settlement of claims of deceased customers
    publisher: Sahyadri Bank (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: IN
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      Sahyadri Bank settles claims of deceased customers as set out in the Reserve Bank of India Directions on responsible business conduct.
      Our threshold limit for the simplified procedure is ₹15 lakh.
      Claims can be lodged at any of our branches, and we issue an acknowledgement on receipt.
      Locker rent for the year is charged on the first working day of April.
      Pradhan Mantri Jeevan Jyoti Bima Yojana and Pradhan Mantri Suraksha Bima Yojana claims are lodged at the branch where the account is held.
      Outstanding loans of a deceased borrower are settled from the estate; the bank will tell the family the amount due on request.

  - url: https://www.narmada-bank.example/deceased-claims
    title: Narmada Bank - Claims for accounts of deceased customers
    publisher: Narmada Bank (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: IN
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      Narmada Bank follows the Reserve Bank of India Directions for settlement of claims of deceased depositors.
      Our threshold limit for the simplified procedure is ₹15 lakh.
      Claims can be lodged at any branch. When all required documents are received we confirm this in writing.
      Term deposits of a deceased depositor can be closed before maturity without any penal charge.

  - url: https://www.bharat-suraksha-life.example/claims/death-claim
    title: Bharat Suraksha Life - How to make a death claim
    publisher: Bharat Suraksha Life Insurance (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: IN
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      To make a death claim, the nominee submits the claim form, a copy of the death certificate, the policy document, the nominee's identity proof and a cancelled cheque.
      Claims can be intimated online, at any branch or through your advisor.
      We settle death claims that do not need investigation within 15 days of intimation, as the IRDAI requires.

  - url: https://www.periyar-bank.example/nri/deceased-accounts
    title: Periyar Bank - Accounts of deceased NRI customers
    publisher: Periyar Bank (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: IN
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      Claims on NRE and NRO accounts of deceased customers are settled under the Reserve Bank of India Directions.
