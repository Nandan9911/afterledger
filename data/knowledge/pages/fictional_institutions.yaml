      Our threshold limit for the simplified procedure is ₹15 lakh.

  - url: https://www.periyar-chits.example/members/bereavement
    title: Periyar Chits - When a subscriber dies
    publisher: Periyar Chits (fictional)
    lang: en
    retrieved: "2026-10-14"
    tier: 2
    jurisdiction: IN
    fictional: true
    text: |
      Fictional institution created for the AfterLedger demo.
      If a subscriber dies before bidding, the nominee or legal heirs may continue the chit or receive the subscriptions paid after deduction of the foreman's commission.
