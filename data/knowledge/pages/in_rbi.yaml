    RESERVE BANK – INTEGRATED OMBUDSMAN SCHEME, 2026
    1. Short Title, Commencement, Extent and Application
    (1) The Scheme shall be called the Reserve Bank– Integrated Ombudsman Scheme (RB-IOS), 2026. It aims to provide a cost-effective, expeditious, non-adversarial alternate grievance redress mechanism for the resolution of complaints against Regulated Entities covered under the Scheme.
    (2) It shall come into force with effect from July 1, 2026.
    9. Grounds of Complaint
    Any customer aggrieved by an act or omission of a Regulated Entity resulting in deficiency in service may file a complaint under the Scheme personally or through an authorised representative as defined under clause 3(1)(c).
    (e) the Complainant had first made a complaint in writing or through any other mode to the Regulated Entity concerned, where proof of having made a complaint can be produced by the Complainant, before making a complaint under the Scheme; and
    (f) the Complainant has not received any reply within 30 days or within the time specified by the Reserve Bank, National Payments Corporation of India, or under Card Network guidelines, if any, whichever is higher after the Regulated Entity received the complaint; or the Complainant is not satisfied with the reply / resolution provided by the Regulated Entity; and
    (g) the complaint is made to the RBI Ombudsman within 90 days from the date on which the timeline specified in sub-clause (1)(f) expires or the date of the last communication from the concerned Regulated Entity, whichever is later; and
    11. Procedure for Filing a Complaint
    (1) The complaint may be lodged online through the portal https://cms.rbi.org.in.
    (2) The complaint may also be submitted through e-mail3 or physical mode to the Centralised Receipt and Processing Centre4 as notified by the Reserve Bank. The complaint, if submitted in physical form, shall be duly signed by the Complainant or by the authorised representative. The complaint submitted in electronic or physical mode shall be in such format as specified in Annex.
    3 crpc@rbi.org.in
    4 Centralised Receipt and Processing Centre, 4th Floor, Reserve Bank of India, Sector -17, Central Vista, Chandigarh - 160017
