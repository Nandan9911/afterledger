  - url: https://www.legislation.gov.uk/eur/2012/650/article/21
    title: "Regulation (EU) No 650/2012, Article 21: General rule"
    publisher: legislation.gov.uk (EUR 2012/650)
    lang: en
    retrieved: "2026-10-14"
    tier: 1
    jurisdiction: EU
    excerpt: true
    text: |
      Unless otherwise provided for in this Regulation, the law applicable to the succession as a whole shall be the law of the State in which the deceased had his habitual residence at the time of death.
      Where, by way of exception, it is clear from all the circumstances of the case that, at the time of death, the deceased was manifestly more closely connected with a State other than the State whose law would be applicable under paragraph 1, the law applicable to the succession shall be the law of that other State.

  - url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
    title: "Assurance-vie : comment savoir si on est bénéficiaire d'un assuré décédé ?"
    publisher: Ministère de la Justice (justice.fr)
    lang: fr
    retrieved: "2026-10-14"
    updated: "01 janvier 2026"
    tier: 1
    jurisdiction: FR
    excerpt: true
    text: |
      Il faut interroger l'Agira.
      L'Agira est compétente pour rechercher les contrats d'assurance-vie d'une personne décédée depuis moins de 10 ans.
      Si la personne est décédée depuis plus de 10 ans, il faut s'adresser à la Caisse des dépôts et consignations (CDC) en utilisant son service en ligne Ciclade.
      Une demande auprès de l'Agira est gratuite.
      Vous pouvez effectuer la démarche sur internet (ou par courrier postal si vous ne pouvez pas utiliser internet)
      vous devez joindre une copie de l'acte de décès de la personne qui aurait souscrit le contrat.
      l'Agira va informer l'ensemble des compagnies d'assurance du décès de l'assuré.
      l'assureur a 1 mois pour vous informer de l'existence d'un contrat à votre profit.

