  - url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    title: 年金を受けている方が亡くなったとき
    publisher: 日本年金機構 (Japan Pension Service)
    lang: ja
    retrieved: '2026-10-15'
    updated: '2026-04-01'
    tier: 1
    jurisdiction: JP
    excerpt: true
    text: |
      年金を受けている方が亡くなったときに、まだ受け取っていない年金や亡くなった日より後に振り込みされた年金のうち、亡くなった月分までの年金については、未支給年金としてその方と生計を同じくしていた遺族が受け取ることができます。未支給年金を受け取るためには、「年金受給権者死亡届（報告書）兼 未支給年金・未支払給付金請求書」の提出が必要です。
      年金を受けていた方が亡くなった当時、その方と生計を同じくしていた、（1）配偶者 （2）子 （3）父母 （4）孫 （5）祖父母 （6）兄弟姉妹 （7）その他（1）から（6）以外の3親等内の親族です。未支給年金を受け取れる順位もこのとおりです。
      先順位者がいる場合は、未支給年金を受け取ることはできません。また、同順位者が2名以上いる場合は、そのうち1名が代表して請求することとなります。
      亡くなった方の年金証書
      法定相続情報一覧図の写し（亡くなった方が被相続人であるもの）
      戸籍謄本・住民票は、亡くなった日より後に交付されたものが必要です。
      年金事務所に郵送により提出してください。
      提出が遅れると、年金を多く受け取りすぎることとなり、後でお返しいただく場合があります。年金を受けている方が亡くなったときは、すみやかにご提出ください。
      亡くなった方の未支給年金は、その支給金を受け取った方の一時所得に該当し、確定申告が必要になる場合があります（支給金を受け取る年分において、その支給金を含む一時所得の金額の合計額が50万円以下である場合には、確定申告は不要です。）。詳細は最寄りの税務署へ相談してください。

  - url: https://www.nenkin.go.jp/faq/jukyu/jukyushatodoke/kyotsu/shibo/20140421.html
    title: 年金受給者が亡くなりました。何か手続きは必要ですか。
    publisher: 日本年金機構 (Japan Pension Service)
    lang: ja
    retrieved: '2026-10-15'
    updated: '2025-11-04'
    tier: 1
    jurisdiction: JP
    excerpt: true
    text: |
      年金受給権者の死亡届は日本年金機構にマイナンバーが収録されている方につきましては、原則不要です。ただし、未支給年金の届出などは必要です。
      死亡届が必要な場合は、10日（国民年金は14日）以内に「死亡届」に死亡年月日、年金証書に記載されている基礎年金番号と年金コード、生年月日などを記入し、亡くなった方の年金証書と、死亡を明らかにすることができる書類（戸籍抄本または住民票の除票など）を添えて、年金事務所または年金相談センターにお出しください。障害基礎年金、遺族基礎年金のみを受けていた方が亡くなった場合は、市・区役所または町村役場にお出しください。死亡届の用紙は、市・区役所または町村役場の国民年金の窓口にあります。
      なお、届出が遅れ、亡くなった日の翌日以後に年金を受け取ったときは、その分を後日お返しいただくことになりますのでご注意ください。

