  - url: https://www.gesetze-im-internet.de/sgb_6/__118.html
    title: "§ 118 SGB VI – Fälligkeit und Auszahlung"
    publisher: Bundesministerium der Justiz (gesetze-im-internet.de)
    lang: de
    retrieved: '2026-10-15'
    tier: 1
    jurisdiction: DE
    excerpt: true
    text: |
      (1) Laufende Geldleistungen mit Ausnahme des Übergangsgeldes werden am Ende des Monats fällig, zu dessen Beginn die Anspruchsvoraussetzungen erfüllt sind; sie werden am letzten Bankarbeitstag dieses Monats ausgezahlt. Bei Zahlung auf ein Konto im Inland ist die Gutschrift der laufenden Geldleistung, auch wenn sie nachträglich erfolgt, so vorzunehmen, dass die Wertstellung des eingehenden Überweisungsbetrages auf dem Empfängerkonto unter dem Datum des Tages erfolgt, an dem der Betrag dem Geldinstitut zur Verfügung gestellt worden ist. Für die rechtzeitige Auszahlung im Sinne von Satz 1 genügt es, wenn nach dem gewöhnlichen Verlauf die Wertstellung des Betrages der laufenden Geldleistung unter dem Datum des letzten Bankarbeitstages erfolgen kann.
      (3) Geldleistungen, die für die Zeit nach dem Tod des Berechtigten auf ein Konto bei einem Geldinstitut, für das die Verordnung (EU) Nr. 260/2012 gilt, überwiesen wurden, gelten als unter Vorbehalt erbracht. Das Geldinstitut hat sie der überweisenden Stelle oder dem Träger der Rentenversicherung zurückzuüberweisen, wenn diese sie als zu Unrecht erbracht zurückfordern. Eine Verpflichtung zur Rücküberweisung besteht nicht, soweit über den entsprechenden Betrag bei Eingang der Rückforderung bereits anderweitig verfügt wurde, es sei denn, dass die Rücküberweisung aus einem Guthaben erfolgen kann. Das Geldinstitut darf den überwiesenen Betrag nicht zur Befriedigung eigener Forderungen verwenden.
