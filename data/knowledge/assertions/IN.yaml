- id: in_rbi_ios_in_force
  text: The Reserve Bank – Integrated Ombudsman Scheme, 2026 has been in force since 1 July 2026.
  quote: "It shall come into force with effect from July 1, 2026."
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 1(2)"
  jurisdiction: IN
  topic: complaints/ombudsman/scheme
  level: gold
  ttl_days: 180
- id: in_rbi_ios_first_complain
  text: A complaint to the RBI Ombudsman can only be made after a complaint to the bank itself, in writing or another way the family can prove.
  quote: "the Complainant had first made a complaint in writing or through any other mode to the Regulated Entity concerned, where proof of having made a complaint can be produced by the Complainant, before making a complaint under the Scheme"
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 10(1)(e)"
  jurisdiction: IN
  topic: complaints/ombudsman/when
  level: gold
  ttl_days: 180
- id: in_rbi_ios_30_days
  text: The bank has 30 days to reply (longer only where RBI, NPCI or card network rules give it more); with no reply by then, or a reply that does not settle it, the complaint can go to the RBI Ombudsman.
  quote: "the Complainant has not received any reply within 30 days or within the time specified by the Reserve Bank, National Payments Corporation of India, or under Card Network guidelines, if any, whichever is higher after the Regulated Entity received the complaint; or the Complainant is not satisfied with the reply / resolution provided by the Regulated Entity"
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 10(1)(f)"
  jurisdiction: IN
  topic: complaints/ombudsman/when
  level: gold
  ttl_days: 180
- id: in_rbi_ios_90_days
  text: The complaint must reach the RBI Ombudsman within 90 days of the bank's time to reply running out, or of its last letter, whichever is later.
  quote: "the complaint is made to the RBI Ombudsman within 90 days from the date on which the timeline specified in sub-clause (1)(f) expires or the date of the last communication from the concerned Regulated Entity, whichever is later"
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 10(1)(g)"
  jurisdiction: IN
  topic: complaints/ombudsman/clock
  level: gold
  ttl_days: 180
- id: in_rbi_ios_online
  text: A complaint to the RBI Ombudsman can be lodged online at cms.rbi.org.in.
  quote: "The complaint may be lodged online through the portal https://cms.rbi.org.in."
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 11(1)"
  jurisdiction: IN
  topic: complaints/ombudsman/how
  level: gold
  ttl_days: 180
- id: in_rbi_ios_post
  text: By e-mail or post, a complaint goes to the RBI's Centralised Receipt and Processing Centre in Chandigarh.
  quote: "Centralised Receipt and Processing Centre, 4th Floor, Reserve Bank of India, Sector -17, Central Vista, Chandigarh - 160017"
  source_url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
  locator: "clause 11(2), footnote 4"
  jurisdiction: IN
  topic: complaints/ombudsman/how
  level: gold
  ttl_days: 180
