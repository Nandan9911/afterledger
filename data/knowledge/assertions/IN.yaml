assertions:
- id: in_rbi_threshold
  text: The threshold limit for the simplified procedure is ₹15 lakh, or a higher limit a bank fixes.
  quote: ‘Threshold limit’ means ₹15 lakh or such higher limit as may be fixed by the bank.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 283(3)
  jurisdiction: IN
  topic: deposit/threshold
  level: gold
  ttl_days: 90
- id: in_rbi_284
  text: Paying the nominee or survivor is a valid discharge of the bank's liability, subject to conditions.
  quote: the payment of the outstanding balance upon the death of the depositor(s) to the nominee(s) / survivor(s) shall be considered a valid discharge of a bank’s liability
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 284
  jurisdiction: IN
  topic: deposit/nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_286_no_legal_docs
  text: When paying a nominee or survivor, the bank may not ask for a succession certificate, probate, an indemnity or a surety, whatever the amount.
  quote: the bank shall not insist on production of legal documents such as Succession Certificate, Letter of Administration, Probate of Will, etc., or seek any bond of indemnity / surety from the nominee(s) / survivor(s) / third-party, irrespective of the amount standing to the credit of the deceased account holder(s).
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 286
  jurisdiction: IN
  topic: deposit/nominee/must_not_ask
  level: gold
  ttl_days: 365
- id: in_rbi_286_claim_form
  text: A nominee's claim needs the Annex V claim form signed by the nominee.
  quote: (1) Claim form, as given in Annex V, duly signed by the nominee(s) / survivor(s);
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 286(1)
  jurisdiction: IN
  topic: deposit/nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_286_ovd
  text: A nominee's claim needs the death certificate and the nominee's officially valid identity document.
  quote: (3) Officially Valid Document of the nominee / survivor towards verifying her / his identity and address.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 286(2)-(3)
  jurisdiction: IN
  topic: deposit/nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_287_simplified
  text: Without a nominee, a bank must use a simplified procedure when the total payable is below the threshold, there is no will, no contesting claim and no court order.
  quote: a bank shall follow a simplified procedure for settlement of claims in respect of deposit accounts where the aggregate amount payable, including accrued interest, as on the date of the application is less than the threshold limit
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 287
  jurisdiction: IN
  topic: deposit/no_nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_287_no_will
  text: The simplified procedure applies only if the depositor left no will.
  quote: (2) there is no Will left behind by the deceased depositor(s),
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 287(2)
  jurisdiction: IN
  topic: deposit/no_nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_287_no_contest
  text: The simplified procedure applies only if there is no contesting claim.
  quote: (3) there is no contesting claim, and
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 287(3)
  jurisdiction: IN
  topic: deposit/no_nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_288_claim_form
  text: Up to the threshold, the claimants sign the Annex VI claim form, except heirs who sign a no-objection letter.
  quote: (1) Claim form, as given in Annex VI, duly filled in and signed by the claimant(s) other than those who have signed the letter of disclaimer/ no objection;
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 288(1)
  jurisdiction: IN
  topic: deposit/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_288_indemnity
  text: Up to the threshold, the claimants sign a bond of indemnity in the Annex VII format.
  quote: (4) Bond of indemnity, as given in Annex VII, signed by the claimant(s);
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 288(4)
  jurisdiction: IN
  topic: deposit/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_288_disclaimer
  text: Heirs who are not claiming sign a letter of disclaimer or no objection in the Annex VIII format.
  quote: (5) Letter of disclaimer / no objection, as given in Annex VIII, from non-claimant legal heir(s), if applicable; and
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 288(5)
  jurisdiction: IN
  topic: deposit/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_288_heirship
  text: Up to the threshold, the heirs are shown either by a legal heir certificate or by an Annex IX declaration from an independent person known to the family.
  quote: (7) Declaration, as given in Annex IX, regarding the legal heir(s) of the deceased depositor(s) by an independent person who is well known to the family of the deceased, is not a party to the claim and is acceptable to the bank.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 288(6)-(7)
  jurisdiction: IN
  topic: deposit/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_288_death_cert
  text: Every deposit claim needs the death certificate.
  quote: (2) Death certificate of the deceased depositor(s);
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 288(2)
  jurisdiction: IN
  topic: deposit/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_289_no_surety
  text: Up to the threshold, the bank may not ask for a surety from anyone else.
  quote: No bond of surety from a third-party shall be obtained in case of claims up to the threshold limit.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 289
  jurisdiction: IN
  topic: deposit/no_nominee/must_not_ask
  level: gold
  ttl_days: 365
- id: in_rbi_290_above
  text: Above the threshold, the bank settles on a succession certificate, or on a legal heir certificate or sworn affidavit, and may ask for a surety.
  quote: 'In cases where claim amount is above the threshold limit, a bank shall settle the claim based on:'
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 290
  jurisdiction: IN
  topic: deposit/above_threshold/route
  level: gold
  ttl_days: 365
- id: in_rbi_291_will
  text: With a will, the bank settles on probate or letters of administration, though it may use its discretion when there is no dispute.
  quote: However, the bank is free to exercise discretion and act as per ‘Will’ of the deceased without requiring production of the probate of such Will
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: paras 291-292
  jurisdiction: IN
  topic: deposit/will/route
  level: gold
  ttl_days: 365
- id: in_rbi_319_15_days
  text: A bank must settle a deposit claim within 15 calendar days of receiving every required document.
  quote: A bank shall settle a claim in respect of deposit accounts of a deceased customer within a period not exceeding 15 calendar days from the date of receipt of all the required documents associated with the claim.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 319
  jurisdiction: IN
  topic: deposit/clock
  level: gold
  ttl_days: 365
- id: in_rbi_317_acknowledge
  text: A claim can be lodged at any branch, and the bank confirms in writing once it has every document.
  quote: On subsequent submission of all the required documents, the bank shall issue a confirmation to the claimant that all required documents have been received for processing of the claim.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 317
  jurisdiction: IN
  topic: deposit/submission
  level: gold
  ttl_days: 180
- id: in_rbi_321_compensation
  text: If the bank is late, it pays interest for the delay at not less than the Bank Rate plus 4% a year, with the Bank Rate taken on the day it had every document.
  quote: compensation shall be paid by the bank in the form of interest, at a rate not less than the prevailing Bank Rate + 4 per cent per annum, on the settlement amount due for the period of delay. The reference date for reckoning the amount due and the prevailing Bank Rate shall be the date of receipt of all required documents from the claimant.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 321
  jurisdiction: IN
  topic: deposit/compensation
  level: gold
  ttl_days: 365
- id: in_rbi_321_reasons
  text: A bank that misses the deadline must tell the claimant the reasons for the delay.
  quote: If any deposit related claim is not settled within the timeframe stipulated at paragraph 319 above, then a bank shall communicate the reasons for such delay to the claimant(s).
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 321
  jurisdiction: IN
  topic: deposit/compensation
  level: gold
  ttl_days: 365
- id: in_rbi_296_fd_premature
  text: A term deposit can be closed early on the depositor's death without any penal charge.
  quote: premature termination of term deposits would be allowed without any penal charge, even if the deposit is within the lock-in-period.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 296
  jurisdiction: IN
  topic: deposit/term_deposit
  level: gold
  ttl_days: 365
- id: in_rbi_299_locker_nominee
  text: A locker nominee is given access to the locker and may remove its contents.
  quote: the bank shall give access to the locker to such nominee(s) with liberty to remove the contents of the locker.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 299
  jurisdiction: IN
  topic: locker/nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_303_locker_docs
  text: A locker nominee's claim needs the Annex V form, the death certificate and the nominee's identity document.
  quote: (2) Death certificate of the safe deposit locker hirer(s); and
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 303
  jurisdiction: IN
  topic: locker/nominee/documents
  level: gold
  ttl_days: 180
- id: in_rbi_306_locker_no_legal
  text: With a nominee, the bank may not ask for a succession certificate, probate or indemnity for a locker unless the nomination is in doubt.
  quote: Production of legal documents, viz., Succession Certificate, Letter of Administration, Probate of Will, etc., or Bond of indemnity from the nominee(s)/ survivor(s) shall not be required unless there is any discrepancy in nomination.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 306
  jurisdiction: IN
  topic: locker/nominee/must_not_ask
  level: gold
  ttl_days: 365
- id: in_rbi_309_locker_simplified
  text: Without a nominee, a locker is released to the heirs under a simplified procedure without legal documents such as a succession certificate.
  quote: a bank shall obtain the following documents to settle the claim without obtaining any legal documents such as Succession Certificate, Letter of Administration, court order, etc.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 309
  jurisdiction: IN
  topic: locker/no_nominee/route
  level: gold
  ttl_days: 365
- id: in_rbi_320_locker_15_days
  text: For a locker, the bank must process the claim and fix the inventory date within 15 calendar days of receiving every document.
  quote: within 15 calendar days of receipt of all the required documents, process the claim and communicate with the claimant(s) for fixing the date for making inventory of the locker
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 320
  jurisdiction: IN
  topic: locker/clock
  level: gold
  ttl_days: 365
- id: in_rbi_322_locker_compensation
  text: A bank that misses the locker deadline pays ₹5,000 for each day of delay.
  quote: the bank shall be required to pay compensation to the claimant(s) at the rate of ₹5,000 for each day of delay
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 322
  jurisdiction: IN
  topic: locker/compensation
  level: gold
  ttl_days: 90
- id: in_rbi_324_foreign_death
  text: A bank accepts a proof of death issued abroad when it is certified in the issuing country by one of five modes, including an apostille.
  quote: 'a bank shall accept the original certified copy of the document issued for ‘proof of death’, certified in the country of its issuance in any one of the following modes:'
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 324
  jurisdiction: IN
  topic: foreign_death_certificate
  level: gold
  ttl_days: 365
- id: in_rbi_324_apostille
  text: An apostille is one of the accepted modes for a death certificate issued abroad.
  quote: (5) Apostilled.
  source_url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/170MD.PDF
  locator: para 324(5)
  jurisdiction: IN
  topic: foreign_death_certificate
  level: gold
  ttl_days: 365
- id: in_sebi_threshold_demat
  text: For dematerialised securities, simplified documentation applies to claims up to ₹30 lakh, and Quick Transmission Processing to claims up to ₹30 thousand.
  quote: Securities in dematerialised mode | 30 | 30
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 3.1
  jurisdiction: IN
  topic: securities/threshold
  level: gold
  ttl_days: 90
- id: in_sebi_threshold_physical
  text: For securities held as paper certificates, simplified documentation applies up to ₹10 lakh, and Quick Transmission Processing up to ₹10 thousand.
  quote: Securities in physical mode | 10 | 10
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 3.1
  jurisdiction: IN
  topic: securities/threshold
  level: gold
  ttl_days: 90
- id: in_sebi_common_docs
  text: Without a nomination, the claimant submits the transmission request form, the client master list of their own demat account, a verifiable death certificate and the statement of account.
  quote: (b) Latest CML of the demat account of the claimant(s);
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 4.2.1
  jurisdiction: IN
  topic: securities/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_sebi_request_form
  text: The claimant uses the transmission request form in Annexure-3 for claims outside Quick Transmission Processing.
  quote: Transmission request form by the claimant(s) (format specified at Annexure-2 for QTP claims and Annexure-3 for other claims);
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 4.2.1(a)
  jurisdiction: IN
  topic: securities/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_sebi_simplified_indemnity
  text: Under simplified documentation, the claimant also gives a notarised indemnity bond in the Annexure-4 format.
  quote: Notarized indemnity bond indemnifying the processing entity (format specified at Annexure-4); and
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 4.2.2.2(a)
  jurisdiction: IN
  topic: securities/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_sebi_simplified_affidavit
  text: Under simplified documentation, all legal heirs give a notarised affidavit-cum-no-objection in the Annexure-5 format.
  quote: Notarised affidavit-cum-NOC from all legal heirs confirming identification and claim of legal ownership to the securities and no objection (format specified at Annexure-5);
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 4.2.2.2(b)
  jurisdiction: IN
  topic: securities/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_sebi_stamp_paper
  text: The indemnity and the affidavit are executed on non-judicial stamp paper of the value the claimant's state requires.
  quote: The indemnity and affidavit-cum-NOC shall be executed on non-judicial stamp paper of appropriate value as specified under the Stamp Act of the state where the claimant resides.
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 4.2.2.2, note 2
  jurisdiction: IN
  topic: securities/no_nominee/documents
  level: gold
  ttl_days: 180
- id: in_sebi_21_days
  text: The processing entity must complete the transmission within 21 calendar days of receiving every required document.
  quote: The entity shall process the transmission case within a period not exceeding 21 calendar days or any such period as may be specified by the Board, from the date of receipt of all the required documents associated with the claim.
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 6.1.11.1
  jurisdiction: IN
  topic: securities/clock
  level: gold
  ttl_days: 365
- id: in_sebi_foreign_death
  text: For a death abroad, the processing entity accepts a death certificate certified in the issuing country, including by apostille, with an English translation if needed.
  quote: In cases involving death of an investor outside India, ‘proof of death’ document is issued by an authority outside the country.
  source_url: https://www.sebi.gov.in/sebi_data/attachdocs/jul-2026/1784869499027.pdf
  locator: Annexure para 6.1.10
  jurisdiction: IN
  topic: foreign_death_certificate
  level: gold
  ttl_days: 365
- id: in_irdai_15_days
  text: An insurer must settle a death claim that needs no investigation within 15 days of the claim being intimated.
  quote: Death claim, except in cases warranting investigation | Within 15 days from the date of intimation of claim.
  source_url: https://irdai.gov.in/document-detail?documentId=6064498
  locator: Life insurance, para 2(1)
  jurisdiction: IN
  topic: life_insurance/clock
  level: gold
  ttl_days: 365
- id: in_irdai_45_days
  text: A death claim that warrants investigation must be settled within 45 days of intimation.
  quote: Death claim warranting investigation | Within 45 days from the date of intimation of claim.
  source_url: https://irdai.gov.in/document-detail?documentId=6064498
  locator: Life insurance, para 2(1)
  jurisdiction: IN
  topic: life_insurance/clock
  level: gold
  ttl_days: 365
- id: in_irdai_interest
  text: If an insurer misses the deadline, it pays interest at the bank rate plus 2% from the date the claim was intimated.
  quote: the claimant is entitled for interest at bank rate plus 2 percent from the date of receipt of intimation till the date of payment.
  source_url: https://irdai.gov.in/document-detail?documentId=6064498
  locator: Life insurance, para 2(2)
  jurisdiction: IN
  topic: life_insurance/compensation
  level: gold
  ttl_days: 365
- id: in_irdai_no_rejection_delay
  text: An insurer may not reject or close a claim because documents or the intimation came late.
  quote: No claim shall be rejected or closed for want of documents or for delayed intimation of claim.
  source_url: https://irdai.gov.in/document-detail?documentId=6064498
  locator: Life insurance, para 1(ii)
  jurisdiction: IN
  topic: life_insurance/must_not
  level: gold
  ttl_days: 365
- id: in_pmjjby_age
  text: PMJJBY can be joined between 18 and 50, and cover continues to age 55 for those who joined before 50.
  quote: 'Eligibility: Age 18–50 years to enroll; coverage continues up to age 55 for those who join before 50.'
  source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/may/doc202558551501.pdf
  jurisdiction: IN
  topic: pmjjby/eligibility
  level: dual_verified
  ttl_days: 180
- id: in_pmjjby_premium
  text: The PMJJBY premium is ₹436 a year, debited automatically from the member's bank or post office account.
  quote: 'Affordable Premium: Just ₹436 per annum, auto-debited from the subscriber''s bank or post office account.'
  source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/may/doc202558551501.pdf
  jurisdiction: IN
  topic: pmjjby/premium
  level: dual_verified
  ttl_days: 90
- id: in_pmjjby_cover
  text: PMJJBY pays ₹2 lakh on the member's death from any cause.
  quote: 'Coverage: ₹2 lakh life insurance in case of the subscriber''s death (from any cause).'
  source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/may/doc202558551501.pdf
  jurisdiction: IN
  topic: pmjjby/cover
  level: dual_verified
  ttl_days: 90
- id: in_pmjjby_claim_30_days
  text: The nominee should make the PMJJBY claim at the bank, preferably within 30 days of the death; later claims are still made the same way.
  quote: preferably within 30 days from the date of the death
  source_url: https://www.kotak.bank.in/content/dam/Kotak/form/Revised-claims-procedure-PMJJBY.pdf
  jurisdiction: IN
  topic: pmjjby/claim
  level: sourced
  ttl_days: 180
- id: in_pmjjby_bank_7_days
  text: The bank must forward a completed PMJJBY claim to the insurer within seven days.
  quote: Maximum time limit for bank / post office to forward duly completed claim form to the insurer is seven days
  source_url: https://www.kotak.bank.in/content/dam/Kotak/form/Revised-claims-procedure-PMJJBY.pdf
  jurisdiction: IN
  topic: pmjjby/clock
  level: sourced
  ttl_days: 180
- id: in_pmjjby_insurer_7_days
  text: The insurer must approve a PMJJBY claim and pay within seven days after that.
  quote: maximum time limit for the insurer to approve claim and disburse money thereafter is seven days
  source_url: https://www.kotak.bank.in/content/dam/Kotak/form/Revised-claims-procedure-PMJJBY.pdf
  jurisdiction: IN
  topic: pmjjby/clock
  level: sourced
  ttl_days: 180
- id: in_pmsby_accident_only
  text: PMSBY pays only for accidental death or disability.
  quote: Accidental death cum disability cover of Rs. Two Lakh (Rs. One Lakh in case of partial disability)
  source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2023/may/doc202359196601.pdf
  jurisdiction: IN
  topic: pmsby/cover
  level: dual_verified
  ttl_days: 180
- id: in_pmsby_premium
  text: The PMSBY premium is ₹20 a year.
  quote: against a premium of just ₹ 20 per annum
  source_url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2023/may/doc202359196601.pdf
  jurisdiction: IN
  topic: pmsby/premium
  level: dual_verified
  ttl_days: 90
- id: in_rbi_msf_oct_2026
  text: From 7 October 2026 the marginal standing facility rate, to which the Bank Rate is aligned, is 5.75%; it was 5.50% before.
  quote: stand adjusted to 5.25 per cent and 5.75 per cent respectively
  source_url: https://www.caalley.com/rbi26/NOTI282BE83CF8F7E464D97B1AA95699F9D721A.pdf
  jurisdiction: IN
  topic: rates/bank_rate
  level: sourced
  ttl_days: 60
  notes: The Bank Rate has been aligned with the marginal standing facility rate since 2012; the rate before 7 October 2026 follows from the 25 basis point change.
- id: in_sahyadri_threshold
  text: Sahyadri Bank uses ₹15 lakh as its threshold for the simplified procedure.
  quote: Our threshold limit for the simplified procedure is ₹15 lakh.
  source_url: https://www.sahyadri-bank.example/bereavement
  jurisdiction: IN
  institution_id: in_sahyadri_bank
  topic: deposit/threshold
  level: dual_verified
  ttl_days: 90
- id: in_sahyadri_locker_rent
  text: Sahyadri Bank charges locker rent once a year, in April.
  quote: Locker rent for the year is charged on the first working day of April.
  source_url: https://www.sahyadri-bank.example/bereavement
  jurisdiction: IN
  institution_id: in_sahyadri_bank
  topic: locker/rent
  level: dual_verified
  ttl_days: 180
- id: in_sahyadri_pmjjby_branch
  text: PMJJBY and PMSBY claims are made at the Sahyadri Bank branch where the account is held.
  quote: Pradhan Mantri Jeevan Jyoti Bima Yojana and Pradhan Mantri Suraksha Bima Yojana claims are lodged at the branch where the account is held.
  source_url: https://www.sahyadri-bank.example/bereavement
  jurisdiction: IN
  institution_id: in_sahyadri_bank
  topic: pmjjby/claim
  level: dual_verified
