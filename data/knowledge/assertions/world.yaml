    institution_id: sg_merlion_savings
    topic: card/after_death
    level: dual_verified
    ttl_days: 180
  - id: sg_straits_final_pay
    text: Straits Marine Engineering pays salary to the date of death and unused leave to the next of kin.
    quote: "Salary up to the date of death and payment for unused annual leave are paid to the next of kin."
    source_url: https://www.straitsmarine.example/hr/bereavement
