  - id: sg_merlion_limit
    text: Merlion Savings Bank may release up to S$150,000 to the next of kin without a grant, at its discretion.
    quote: "Where the total balance is S$150,000 or less, we may release the funds to the next of kin without a Grant of Probate or Letters of Administration, at our discretion."
    source_url: https://www.merlionsavings.example/bereavement
    jurisdiction: SG
