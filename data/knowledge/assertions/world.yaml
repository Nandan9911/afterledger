# Japan, the UK, the US, Singapore, France and the EU, plus the demo's fictional institutions.
assertions:
  # ---- Japan -----------------------------------------------------------------------------------
  - id: jp_renounce_3_months
    text: An heir must accept or renounce an inheritance within three months of learning that it has opened for them.
    quote: "申述は，民法により自己のために相続の開始があったことを知ったときから3か月以内にしなければならないと定められています。"
    quote_translation: "The Civil Code requires the application to be made within three months of the time the heir learned that succession had opened for them."
    source_url: https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_06_13/index.html
    jurisdiction: JP
    topic: inheritance/renunciation/clock
    level: dual_verified
    ttl_days: 365
  - id: jp_renounce_court
    text: Renunciation is applied for at the family court for the deceased's last address.
    quote: "被相続人の最後の住所地の家庭裁判所"
    quote_translation: "The family court for the deceased's last address."
    source_url: https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_06_13/index.html
    jurisdiction: JP
    topic: inheritance/renunciation/where
    level: dual_verified
    ttl_days: 365
  - id: jp_renounce_fee
    text: The application costs ¥800 in revenue stamps for each person applying.
    quote: "収入印紙800円分（申述人1人につき）"
    quote_translation: "Revenue stamps worth ¥800 (per applicant)."
    source_url: https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_06_13/index.html
    jurisdiction: JP
    topic: inheritance/renunciation/fee
    level: dual_verified
    ttl_days: 90
  - id: jp_renounce_extension
    text: The family court can extend the three-month period on application.
    quote: "相続の承認又は放棄の期間の伸長の申立てにより，家庭裁判所はその期間を伸ばすことができます。"
    quote_translation: "On an application to extend the period for accepting or renouncing, the family court can extend it."
    source_url: https://www.courts.go.jp/saiban/syurui/syurui_kazi/kazi_06_13/index.html
    jurisdiction: JP
    topic: inheritance/renunciation/extension
    level: dual_verified
    ttl_days: 365
  - id: jp_heir_cert_free
    text: The Legal Affairs Bureau issues a certified copy of the statutory heir information chart free of charge.
    quote: "その一覧図に認証文を付した写しを無料で交付する"
    quote_translation: "issues, free of charge, a copy of the chart with a certification statement"
    source_url: https://houmukyoku.moj.go.jp/homu/page7_000013.html
    jurisdiction: JP
    topic: heir_certificate/issue
    level: dual_verified
    ttl_days: 180
  - id: jp_heir_cert_replaces
    text: The certified chart can be used in place of the bundle of family register certificates.
    quote: "戸除籍謄本等の束の代わりに相続登記にご利用いただくことができる"
    quote_translation: "can be used for inheritance registration instead of the bundle of family register certificates"
    source_url: https://houmukyoku.moj.go.jp/homu/page7_000013.html
    jurisdiction: JP
    topic: heir_certificate/use
    level: dual_verified
    ttl_days: 180
  - id: jp_heir_cert_apply
    text: To get it, an heir submits the chart with the bundle of family register certificates to the registry office.
    quote: "相続関係を一覧に表した図（法定相続情報一覧図）とともに、戸除籍謄本等の束を登記所に提出"
    quote_translation: "submit the bundle of family register certificates to the registry office together with a chart of the inheritance relationships"
    source_url: https://houmukyoku.moj.go.jp/homu/page7_000013.html
    jurisdiction: JP
    topic: heir_certificate/apply
    level: dual_verified
    ttl_days: 180
  - id: jp_liaj_inquiry
    text: Since 1 July 2021 the Life Insurance Association of Japan runs an inquiry service for finding a person's life policies.
    quote: "2021 年7 月1 日から生命保険契約照会制度が始まりました"
    quote_translation: "The life insurance contract inquiry system began on 1 July 2021."
    source_url: https://www.zeiken.co.jp/zeikenpress/press/0007pp20211026/
    jurisdiction: JP
    topic: life_insurance/search
    level: sourced
    ttl_days: 180
    notes: Tier 4 source (a tax firm's newsletter). A plan that relies on it starts by confirming with the Association.
  - id: jp_liaj_fee
    text: The inquiry costs ¥3,000 per request.
    quote: "利用料は1 回の照会あたり3,000 円（税込）となります"
    quote_translation: "The fee is ¥3,000 (tax included) per inquiry."
    source_url: https://www.zeiken.co.jp/zeikenpress/press/0007pp20211026/
    jurisdiction: JP
    topic: life_insurance/search
    level: sourced
    ttl_days: 90
  - id: jp_liaj_answer
    text: The answer says only whether a policy exists with the deceased as policyholder or insured.
    quote: "契約者または被保険者が照会対象者である生命保険契約の有無"
    quote_translation: "whether there is a life insurance contract with the person as policyholder or insured"
    source_url: https://www.zeiken.co.jp/zeikenpress/press/0007pp20211026/
    jurisdiction: JP
    topic: life_insurance/search
    level: sourced
    ttl_days: 180
  - id: jp_national_law
    text: Japan's conflict-of-laws rule makes succession follow the law of the deceased's nationality.
    quote: "相続は、被相続人の本国法による"
    quote_translation: "Succession is governed by the national law of the deceased."
    source_url: https://www.kitahama.or.jp/wp-content/uploads/2019/11/International-Inheritance-Newsletter-Vol.-1.pdf
    jurisdiction: JP
    topic: conflict_of_laws/succession
    level: sourced
    ttl_days: 365
    notes: Quotes Article 36 of the Act on General Rules for Application of Laws via a law firm's newsletter (tier 4).
  - id: jp_naniwa_documents
    text: Naniwa Bank needs its inheritance request form signed and sealed by every heir, the heir information chart or the full family registers, every heir's seal certificate, and the passbook and card.
    quote: "相続のお手続きには、相続手続依頼書、法定相続情報一覧図の写しまたは被相続人の出生から死亡までの戸籍謄本、相続人全員の印鑑証明書、通帳とキャッシュカードが必要です。"
    quote_translation: "For inheritance procedures you need the inheritance request form, a copy of the statutory heir information chart or the deceased's family registers from birth to death, seal certificates of all heirs, and the passbook and cash card."
    source_url: https://www.naniwa-bank.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_bank
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  - id: jp_naniwa_seal
    text: Every heir signs Naniwa Bank's request form and stamps it with their registered seal.
    quote: "相続手続依頼書には相続人全員が署名し、実印を押印してください。"
    quote_translation: "All heirs must sign the inheritance request form and stamp it with their registered seal."
    source_url: https://www.naniwa-bank.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_bank
    topic: deposit/forms
    level: dual_verified
    ttl_days: 180
  - id: jp_naniwa_balance_cert
    text: Naniwa Bank issues a balance certificate at the request of any one heir.
    quote: "残高証明書は相続人のお一人からのご請求で発行します。"
    quote_translation: "We issue a balance certificate at the request of one heir."
    source_url: https://www.naniwa-bank.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_bank
    topic: deposit/balance_certificate
    level: dual_verified
    ttl_days: 180
  - id: jp_naniwa_two_weeks
    text: Naniwa Bank completes the procedure about two weeks after it has every document.
    quote: "書類がそろってから約2週間でお手続きが完了します。"
    quote_translation: "The procedure is completed about two weeks after all documents are in."
    source_url: https://www.naniwa-bank.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_bank
    topic: deposit/clock
    level: dual_verified
    ttl_days: 90
  - id: jp_yodogawa_documents
    text: Yodogawa Shinkin needs its inheritance notice, the heir information chart and every heir's seal certificate.
    quote: "相続のお手続きには、相続届、法定相続情報一覧図の写し、相続人全員の印鑑証明書が必要です。"
    quote_translation: "You need the inheritance notice, a copy of the statutory heir information chart and seal certificates of all heirs."
    source_url: https://www.yodogawa-shinkin.example/souzoku
    jurisdiction: JP
    institution_id: jp_yodogawa_shinkin
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  - id: jp_minato_documents
    text: Minato Seimei needs the claim form, the death certificate and the beneficiary's identity document.
    quote: "死亡保険金のご請求には、請求書、死亡診断書または死体検案書、受取人の本人確認書類が必要です。"
    quote_translation: "To claim the death benefit you need the claim form, a death certificate, and the beneficiary's identity document."
    source_url: https://www.minato-seimei.example/seikyu/shibou
    jurisdiction: JP
    institution_id: jp_minato_seimei
    topic: life_insurance/documents
    level: dual_verified
    ttl_days: 180
  - id: jp_minato_5_days
    text: Minato Seimei pays within five business days of receiving the claim papers.
    quote: "ご請求書類が到着した日の翌日から5営業日以内にお支払いします。"
    quote_translation: "We pay within five business days from the day after the claim documents arrive."
    source_url: https://www.minato-seimei.example/seikyu/shibou
    jurisdiction: JP
    institution_id: jp_minato_seimei
    topic: life_insurance/clock
    level: dual_verified
    ttl_days: 90
  - id: jp_naniwa_card_balance
    text: Naniwa Card sends a balance certificate for the card loan when the family tells it of the death.
    quote: "会員様がお亡くなりになった場合は、ご遺族からご連絡ください。カードローンの残高証明書をお送りします。"
    quote_translation: "If a member dies, please contact us; we will send a card loan balance certificate."
    source_url: https://www.naniwa-card.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_card
    topic: loan/after_death
    level: dual_verified
    ttl_days: 180
  - id: jp_toto_foreign_signature
    text: Toto Bank accepts a signature certificate from a Japanese embassy or consulate instead of a seal certificate for heirs living abroad.
    quote: "相続人が外国に住んでいる場合は、印鑑証明書の代わりに在外公館で発行されたサイン証明書をご提出ください。"
    quote_translation: "If an heir lives abroad, submit a signature certificate issued by a Japanese diplomatic mission instead of a seal certificate."
    source_url: https://www.toto-bank.example/souzoku
    jurisdiction: JP
    institution_id: jp_toto_bank
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  # ---- United Kingdom --------------------------------------------------------------------------
  - id: gb_tuo_what
    text: Tell Us Once reports a death to most government organisations in one go.
    quote: "Tell Us Once is a service that lets you report a death to most government organisations in one go."
    source_url: https://www.gov.uk/after-a-death/organisations-you-need-to-contact-and-tell-us-once
    jurisdiction: GB
    topic: notification/government
    level: gold
    ttl_days: 180
  - id: gb_tuo_28_days
    text: The Tell Us Once reference must be used within 28 days of getting it.
    quote: "You must use the service within 28 days of getting your unique reference number."
    source_url: https://www.gov.uk/after-a-death/organisations-you-need-to-contact-and-tell-us-once
    jurisdiction: GB
    topic: notification/government/clock
    level: gold
    ttl_days: 180
  - id: gb_tuo_not_banks
    text: Banks are not told through Tell Us Once; the family contacts them.
    quote: "To close or change the details of the person’s financial accounts, you’ll need to contact organisations like:"
    source_url: https://www.gov.uk/after-a-death/organisations-you-need-to-contact-and-tell-us-once
    jurisdiction: GB
    topic: notification/banks
    level: gold
    ttl_days: 180
  - id: gb_dns_free
    text: The Death Notification Service is free and notifies its member organisations at the same time.
    quote: "The Death Notification Service is a free service which allows you to notify a number of member organisations of a person's death, at the same time."
    source_url: https://www.deathnotificationservice.co.uk/
    jurisdiction: GB
    topic: notification/banks
    level: dual_verified
    ttl_days: 180
  - id: gb_nsi_claim_online
    text: NS&I claims start online, without needing an account.
    quote: "The first step is to make a claim, which can be done online, without needing to create an online account."
    source_url: https://www.nsandi.com/help/manage-money-for-others/customers-who-have-died
    jurisdiction: GB
    institution_id: gb_nsandi
    topic: premium_bonds/claim
    level: dual_verified
    ttl_days: 180
  - id: gb_nsi_12_months
    text: Premium Bonds can stay in the prize draws for 12 months after the death.
    quote: "Premium Bonds can remain eligible for the draw for 12 months after the date of death in the existing NS&I holder's name."
    source_url: https://www.nsandi.com/help/manage-money-for-others/customers-who-have-died
    jurisdiction: GB
    institution_id: gb_nsandi
    topic: premium_bonds/after_death
    level: dual_verified
    ttl_days: 180
  - id: gb_nsi_grant
    text: NS&I may ask for a grant of representation when total NS&I savings are £5,000 or more, and reserves the right to for any amount.
    quote: "may ask for this if the customer's total NS&I savings are £5,000 or over."
    source_url: https://www.nsandi.com/help/manage-money-for-others/customers-who-have-died
    jurisdiction: GB
    institution_id: gb_nsandi
    topic: premium_bonds/grant
    level: dual_verified
    ttl_days: 90
  - id: gb_airevalley_limit
    text: Aire Valley Bank usually releases up to £50,000 without a grant of probate.
    quote: "If the total held with us is £50,000 or less, we can usually release the money without a grant of probate."
    source_url: https://www.airevalleybank.example/bereavement
    jurisdiction: GB
    institution_id: gb_aire_valley_bank
    topic: deposit/probate_limit
    level: dual_verified
    ttl_days: 90
  - id: gb_airevalley_dns
    text: Aire Valley Bank accepts notification through the Death Notification Service.
    quote: "You can tell us about a death through the Death Notification Service or at any branch."
    source_url: https://www.airevalleybank.example/bereavement
    jurisdiction: GB
    institution_id: gb_aire_valley_bank
    topic: notification/banks
    level: dual_verified
    ttl_days: 180
  - id: gb_airevalley_documents
    text: Aire Valley Bank needs the death certificate, any will and the executor's identification.
    quote: "We will need the death certificate, the will if there is one, and identification for the executor or next of kin."
    source_url: https://www.airevalleybank.example/bereavement
    jurisdiction: GB
    institution_id: gb_aire_valley_bank
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  - id: gb_airevalley_10_days
    text: Aire Valley Bank aims to release funds within 10 working days of receiving everything.
    quote: "We aim to release funds within 10 working days of receiving everything we need."
    source_url: https://www.airevalleybank.example/bereavement
    jurisdiction: GB
    institution_id: gb_aire_valley_bank
    topic: deposit/clock
    level: dual_verified
    ttl_days: 90
  - id: gb_pennine_limit
    text: Pennine Building Society usually releases up to £30,000 in total without a grant of representation.
    quote: "We can usually release balances of up to £30,000 in total without a grant of representation."
    source_url: https://www.penninebs.example/help/bereavement
    jurisdiction: GB
    institution_id: gb_pennine_bs
    topic: deposit/probate_limit
    level: dual_verified
    ttl_days: 90
  - id: gb_pennine_documents
    text: Pennine Building Society needs the death certificate and its bereavement form signed by the executors.
    quote: "Send us the death certificate and our bereavement form signed by the executors."
    source_url: https://www.penninebs.example/help/bereavement
    jurisdiction: GB
    institution_id: gb_pennine_bs
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  - id: gb_leedsmills_return
    text: Pension paid by the Leeds Mills scheme for the period after the death has to be returned.
    quote: "Any pension paid for the period after the date of death will need to be returned."
    source_url: https://www.leedsmillspension.example/members/death
    jurisdiction: GB
    institution_id: gb_leeds_mills_pension
    topic: pension/after_death
    level: dual_verified
    ttl_days: 180
  - id: gb_leedsmills_dependant
    text: A dependant's pension or lump sum may be payable from the Leeds Mills scheme.
    quote: "A dependant's pension or lump sum may be payable; we will write to the next of kin with the details."
    source_url: https://www.leedsmillspension.example/members/death
    jurisdiction: GB
    institution_id: gb_leeds_mills_pension
    topic: pension/survivor
    level: dual_verified
    ttl_days: 180
  # ---- United States ---------------------------------------------------------------------------
  - id: us_ssa_month_of_death
    text: Social Security is not paid for the month in which the beneficiary dies, so the payment for that month must be returned.
    quote: "Social Security benefits are not paid for the month in which a beneficiary dies."
    source_url: https://www.everycrsreport.com/files/20110705_93-792_8db12073917b83c79d5b3b3555f12afdf1a41343.html
    jurisdiction: US
    topic: social_security/month_of_death
    level: gold
    ttl_days: 365
  - id: us_ssa_return
    text: A payment received for the month of death has to be returned to the government.
    quote: "Subsequently, they are informed that the check must be returned to the government."
    source_url: https://www.everycrsreport.com/files/20110705_93-792_8db12073917b83c79d5b3b3555f12afdf1a41343.html
    jurisdiction: US
    topic: social_security/return
    level: gold
    ttl_days: 365
  - id: us_ssa_255
    text: A spouse who lived with the worker, or a spouse or child eligible for survivor benefits, may receive a $255 lump-sum death payment.
    quote: "may receive a Social Security lump-sum death payment of $255"
    source_url: https://www.everycrsreport.com/files/20110705_93-792_8db12073917b83c79d5b3b3555f12afdf1a41343.html
    jurisdiction: US
    topic: social_security/lump_sum
    level: gold
    ttl_days: 365
  - id: us_ssa_255_who
    text: The lump sum goes to the spouse who was living with the worker, or a spouse or child eligible for survivor benefits.
    quote: "the spouse who was living with the worker, or a spouse or child eligible for survivor benefits"
    source_url: https://www.everycrsreport.com/files/20110705_93-792_8db12073917b83c79d5b3b3555f12afdf1a41343.html
    jurisdiction: US
    topic: social_security/lump_sum
    level: gold
    ttl_days: 365
  - id: us_naic_locator
    text: The NAIC Life Insurance Policy Locator is a free tool where a request goes through a secure portal.
    quote: "Consumers can submit a request through the secure, encrypted portal."
    source_url: https://content.naic.org/article/naic-life-insurance-policy-locator-tool-helps-match-consumers-more-16-billion-lost-and-unclaimed
    jurisdiction: US
    topic: life_insurance/search
    level: dual_verified
    ttl_days: 180
  - id: us_naic_free
    text: The locator has been free since it launched in November 2016.
    quote: "since the free tool launched in November 2016"
    source_url: https://content.naic.org/article/naic-life-insurance-policy-locator-tool-helps-match-consumers-more-16-billion-lost-and-unclaimed
    jurisdiction: US
    topic: life_insurance/search
    level: dual_verified
    ttl_days: 180
  - id: us_tx_sea_30_days
    text: A Texas small estate affidavit can be used only after 30 days have passed since the death.
    quote: "30 days have elapsed since the date of the decedent's death;"
    source_url: https://tcss.legis.texas.gov/resources/ES/htm/ES.205.htm
    jurisdiction: US-TX
    topic: small_estate/conditions
    level: dual_verified
    ttl_days: 365
  - id: us_tx_sea_no_petition
    text: The affidavit route requires that no petition to appoint a personal representative is pending or granted.
    quote: "no petition for the appointment of a personal representative is pending or has been granted;"
    source_url: https://tcss.legis.texas.gov/resources/ES/htm/ES.205.htm
    jurisdiction: US-TX
    topic: small_estate/conditions
    level: dual_verified
    ttl_days: 365
  - id: us_tx_sea_75000
    text: The estate, not counting the homestead and exempt property, must be worth $75,000 or less.
    quote: "excluding homestead and exempt property, does not exceed $75,000"
    source_url: https://tcss.legis.texas.gov/resources/ES/htm/ES.205.htm
    jurisdiction: US-TX
    topic: small_estate/threshold
    level: dual_verified
    ttl_days: 90
  - id: us_tx_sea_intestate
    text: The small estate affidavit is for estates where the person died without a will.
    quote: "The distributees of the estate of a decedent who dies intestate are entitled to the decedent's estate without waiting for the appointment of a personal"
    source_url: https://tcss.legis.texas.gov/resources/ES/htm/ES.205.htm
    jurisdiction: US-TX
    topic: small_estate/conditions
    level: dual_verified
    ttl_days: 365
  - id: us_missionriver_sea
    text: Mission River Bank accepts a court-approved Texas small estate affidavit when no personal representative is appointed.
    quote: "If no personal representative has been appointed, we accept a small estate affidavit approved by a Texas court."
    source_url: https://www.missionriverbank.example/estate-services
    jurisdiction: US-TX
    institution_id: us_mission_river_bank
    topic: deposit/route
    level: dual_verified
    ttl_days: 180
  - id: us_missionriver_treasury
    text: Mission River Bank may return federal benefit payments received after the death to the Treasury from the account.
    quote: "Federal benefit payments received after the date of death may be returned to the Treasury from the account."
    source_url: https://www.missionriverbank.example/estate-services
    jurisdiction: US-TX
    institution_id: us_mission_river_bank
    topic: social_security/return
    level: dual_verified
    ttl_days: 180
  - id: us_lonestar_claim
    text: Lone Star Life pays beneficiaries on its claimant statement and a certified death certificate, and has Spanish forms.
    quote: "Beneficiaries can file a claim with our claimant statement and a certified copy of the death certificate."
    source_url: https://www.lonestarlife.example/claims
    jurisdiction: US-TX
    institution_id: us_lone_star_life
    topic: life_insurance/documents
    level: dual_verified
    ttl_days: 180
  - id: us_lonestar_30_days
    text: Lone Star Life aims to decide claims within 30 days of a completed claimant statement.
    quote: "We aim to decide claims within 30 days of receiving the completed claimant statement."
    source_url: https://www.lonestarlife.example/claims
    jurisdiction: US-TX
    institution_id: us_lone_star_life
    topic: life_insurance/clock
    level: dual_verified
    ttl_days: 90
  - id: us_riverwalk_benefits
    text: Riverwalk Logistics' HR handles the final paycheck, the 401(k) account and group life insurance after an employee dies.
    quote: "Contact Human Resources about the final paycheck, the 401(k) plan account and the group life insurance that eligible employees receive."
    source_url: https://www.riverwalklogistics.example/hr/benefits-after-a-death
    jurisdiction: US-TX
    institution_id: us_riverwalk_logistics
    topic: employer/benefits
    level: dual_verified
    ttl_days: 180
  # ---- Singapore ---------------------------------------------------------------------------------
  - id: sg_cpf_no_nomination
    text: Without a CPF nomination, CPF savings are paid to the Public Trustee's Office, which distributes them under the intestacy laws or an inheritance certificate for Muslims.
    quote: "When you are no longer around, we will pay your CPF savings to the Public Trustee's Office for distribution in cash to your family member(s) in accordance with the relevant intestacy laws"
    source_url: https://www.cpf.gov.sg/service/article/what-happens-to-my-cpf-savings-if-i-did-not-make-a-cpf-nomination
    jurisdiction: SG
    topic: cpf/no_nomination
