    source_url: https://www.ssa.gov/benefits/survivors/
    jurisdiction: US
    topic: social_security/report
    level: gold
    ttl_days: 365
  - id: us_ssa_survivors_who
    text: Survivor benefits can go to the spouse, a divorced spouse, a child or a dependent parent of someone who worked and paid Social Security taxes.
    quote: You may qualify if you’re the spouse, divorced spouse, child, or dependent parent of someone who worked and paid Social
    source_url: https://www.ssa.gov/benefits/survivors/
    jurisdiction: US
    topic: social_security/survivors
    level: gold
    ttl_days: 365
  - id: jp_civil_921_disposal
    text: An heir who disposes of any of the estate (beyond acts that only preserve it) is treated as having accepted the inheritance, debts included.
    quote: 次に掲げる場合には、相続人は、単純承認をしたものとみなす。 一 相続人が相続財産の全部又は一部を処分したとき。
    quote_translation: In the following cases the heir is deemed to have accepted unconditionally - 1. when the heir has disposed of all or part of the inherited property.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=921
    locator: 民法 第921条第1号
    jurisdiction: JP
    topic: inheritance/renunciation/deemed_acceptance
    level: gold
    ttl_days: 730
  - id: jp_naniwa_card_renounce
    text: If the family renounces the inheritance, Naniwa Card asks for a copy of the family court's notice accepting the renunciation.
    quote: 相続放棄をされる場合は、家庭裁判所の受理通知書の写しをお送りください。
    quote_translation: If you renounce the inheritance, please send us a copy of the family court's notice of acceptance.
    source_url: https://www.naniwa-card.example/souzoku
    jurisdiction: JP
    institution_id: jp_naniwa_card
    topic: loan/after_death
    level: dual_verified
    ttl_days: 180
  - id: jp_yodogawa_contact
    text: Yodogawa Shinkin asks the family to contact the branch before starting.
    quote: お手続きの前に、お取引店へご連絡ください。
    quote_translation: Please contact your branch before starting the procedure.
    source_url: https://www.yodogawa-shinkin.example/souzoku
    jurisdiction: JP
    institution_id: jp_yodogawa_shinkin
    topic: deposit/submission
    level: dual_verified
    ttl_days: 180
  - id: jp_liaj_heirs
    text: When the reason is a death, the person asking is one of the deceased's statutory heirs.
    quote: 死亡を利用事由とする場合の照会者は、照会対象者の法定相続人
    quote_translation: Where the reason for use is death, the inquirer is a statutory heir of the person being searched for.
    source_url: https://www.zeiken.co.jp/zeikenpress/press/0007pp20211026/
    jurisdiction: JP
    topic: life_insurance/search
    level: sourced
    ttl_days: 180
