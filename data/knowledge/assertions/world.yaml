  # ---- France ------------------------------------------------------------------------------------
  # ---- EU and Germany ----------------------------------------------------------------------------
  - id: eu_650_art21_1
    text: Under the EU Succession Regulation, succession as a whole follows the law of the State where the deceased was habitually resident at death.
    quote: "Unless otherwise provided for in this Regulation, the law applicable to the succession as a whole shall be the law of the State in which the deceased had his habitual residence at the time of death."
    source_url: https://www.legislation.gov.uk/eur/2012/650/article/21
    jurisdiction: EU
    topic: conflict_of_laws/succession
    level: gold
    ttl_days: 365
  - id: eu_650_art21_2
    text: As an exception, the law of another State applies if the deceased was manifestly more closely connected with it.
    quote: "the deceased was manifestly more closely connected with a State other than the State whose law would be applicable under paragraph 1"
    source_url: https://www.legislation.gov.uk/eur/2012/650/article/21
    jurisdiction: EU
    topic: conflict_of_laws/succession
    level: gold
    ttl_days: 365
  - id: de_isarbank_erbschein
    text: Isarbank München usually needs a certificate of inheritance (Erbschein) or a European Certificate of Succession before paying the heirs.
    quote: "Für die Auszahlung an die Erben benötigen wir in der Regel einen Erbschein oder ein Europäisches Nachlasszeugnis."
    quote_translation: "To pay out to the heirs we normally need a certificate of inheritance or a European Certificate of Succession."
    source_url: https://www.isarbank.example/nachlass
    jurisdiction: DE
    institution_id: de_isarbank
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  - id: de_isarbank_will
    text: Isarbank München may accept an opened notarial will instead of the certificate of inheritance.
    quote: "Ein eröffnetes notarielles Testament kann den Erbschein ersetzen."
    quote_translation: "An opened notarial will can replace the certificate of inheritance."
    source_url: https://www.isarbank.example/nachlass
    jurisdiction: DE
    institution_id: de_isarbank
    topic: deposit/documents
    level: dual_verified
    ttl_days: 180
  # ---- Germany: statutory pension after a death (SGB VI), added 15 Oct 2026 ----------------------
  - id: de_pension_until_month_of_death
    text: A German state pension is paid up to the end of the calendar month in which the pensioner died.
    quote: "Renten werden bis zum Ende des Kalendermonats geleistet, in dem die Berechtigten gestorben sind."
    quote_translation: "Pensions are paid up to the end of the calendar month in which the person entitled died."
    source_url: https://www.gesetze-im-internet.de/sgb_6/__102.html
    locator: "§ 102 Abs. 5 SGB VI"
    jurisdiction: DE
    topic: pension/after_death/until
    level: gold
    ttl_days: 730
  - id: de_pension_paid_end_of_month
    text: A German state pension falls due at the end of each month it is for, and is paid on the last bank working day of that month.
    quote: "Laufende Geldleistungen mit Ausnahme des Übergangsgeldes werden am Ende des Monats fällig, zu dessen Beginn die Anspruchsvoraussetzungen erfüllt sind; sie werden am letzten Bankarbeitstag dieses Monats ausgezahlt."
    quote_translation: "Current cash benefits other than transitional allowance fall due at the end of the month at whose start the conditions are met; they are paid on the last bank working day of that month."
    source_url: https://www.gesetze-im-internet.de/sgb_6/__118.html
    locator: "§ 118 Abs. 1 Satz 1 SGB VI"
    jurisdiction: DE
    topic: pension/payment/when
    level: gold
    ttl_days: 730
  - id: de_pension_after_death_reserved
    text: Pension paid into an account for the time after the pensioner's death counts as paid under reserve.
    quote: "Geldleistungen, die für die Zeit nach dem Tod des Berechtigten auf ein Konto bei einem Geldinstitut, für das die Verordnung (EU) Nr. 260/2012 gilt, überwiesen wurden, gelten als unter Vorbehalt erbracht."
    quote_translation: "Cash benefits transferred to an account at a bank covered by Regulation (EU) No 260/2012 for the period after the death of the person entitled are deemed to have been paid under reserve."
    source_url: https://www.gesetze-im-internet.de/sgb_6/__118.html
    locator: "§ 118 Abs. 3 Satz 1 SGB VI"
    jurisdiction: DE
    topic: pension/after_death/reclaim
    level: gold
    ttl_days: 730
  - id: de_pension_bank_returns
    text: The bank must send pension paid for the time after the death back when the pension insurance reclaims it as paid wrongly.
    quote: "Das Geldinstitut hat sie der überweisenden Stelle oder dem Träger der Rentenversicherung zurückzuüberweisen, wenn diese sie als zu Unrecht erbracht zurückfordern."
    quote_translation: "The bank must transfer them back to the paying office or the pension insurance institution if these reclaim them as wrongly paid."
    source_url: https://www.gesetze-im-internet.de/sgb_6/__118.html
    locator: "§ 118 Abs. 3 Satz 2 SGB VI"
    jurisdiction: DE
    topic: pension/after_death/reclaim
    level: gold
    ttl_days: 730
  - id: de_pension_bank_no_setoff
    text: The bank may not use pension paid after the death to settle what it is owed itself.
    quote: "Das Geldinstitut darf den überwiesenen Betrag nicht zur Befriedigung eigener Forderungen verwenden."
    quote_translation: "The bank may not use the amount transferred to satisfy its own claims."
    source_url: https://www.gesetze-im-internet.de/sgb_6/__118.html
    locator: "§ 118 Abs. 3 Satz 4 SGB VI"
    jurisdiction: DE
    topic: pension/after_death/reclaim
    level: gold
    ttl_days: 730
  # ---- UK probate ------------------------------------------------------------------------------------
  - id: gb_probate_what
    text: Probate is the legal right to deal with a person's property, money and possessions after they die.
    quote: "Probate is the legal right to deal with someone’s property, money and possessions (their ‘estate’) when they die."
    source_url: https://www.gov.uk/applying-for-probate
    jurisdiction: GB
    topic: probate/what
    level: gold
    ttl_days: 365
  - id: gb_probate_own_rules
    text: Each financial organisation has its own rules on when it needs probate, so ask each one.
    quote: "Every organisation has its own rules."
    source_url: https://www.gov.uk/applying-for-probate
    jurisdiction: GB
    topic: probate/thresholds
    level: gold
    ttl_days: 365
  - id: gb_probate_joint
    text: Property owned as joint tenants passes automatically to the surviving owners without probate.
    quote: "owned land or property as ‘joint tenants’ with others - this automatically passes to the surviving owners"
    source_url: https://www.gov.uk/applying-for-probate
    jurisdiction: GB
    topic: probate/not_needed
    level: gold
    ttl_days: 365
  # ---- Japan: Civil Code (e-Gov), added 14 Oct 2026 ------------------------------------------------
  - id: jp_civil_887_children
    text: The children of the deceased are heirs.
    quote: 被相続人の子は、相続人となる。
    quote_translation: The children of the decedent become heirs.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=887
    locator: 民法 第887条第1項
    jurisdiction: JP
    topic: heirship/statutory
    level: gold
    ttl_days: 730
  - id: jp_civil_890_spouse
    text: The spouse of the deceased is always an heir, alongside the children.
    quote: 被相続人の配偶者は、常に相続人となる。
    quote_translation: The spouse of the decedent is always an heir.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=890
    locator: 民法 第890条
    jurisdiction: JP
    topic: heirship/statutory
    level: gold
    ttl_days: 730
  - id: jp_civil_896_debts
    text: Heirs take on all of the deceased's rights and obligations, debts included, from the moment of death.
    quote: 相続人は、相続開始の時から、被相続人の財産に属した一切の権利義務を承継する。
    quote_translation: From the commencement of inheritance, heirs succeed to all rights and obligations that belonged to the decedent's property.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=896
    locator: 民法 第896条
    jurisdiction: JP
    topic: inheritance/debts
    level: gold
    ttl_days: 730
  - id: jp_civil_915_3_months
    text: An heir must accept, accept with limited liability, or renounce within three months of learning the inheritance opened for them; the family court can extend this.
    quote: 相続人は、自己のために相続の開始があったことを知った時から三箇月以内に、相続について、単純若しくは限定の承認又は放棄をしなければならない。
    quote_translation: An heir must, within three months from the time they learned that inheritance commenced for them, accept unconditionally or with qualification, or renounce.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=915
    locator: 民法 第915条第1項
    jurisdiction: JP
    topic: inheritance/renunciation/clock
    level: gold
    ttl_days: 730
  - id: jp_civil_939_effect
    text: An heir who renounces is treated as never having been an heir.
    quote: 相続の放棄をした者は、その相続に関しては、初めから相続人とならなかったものとみなす。
    quote_translation: A person who renounces is deemed never to have been an heir to that inheritance.
    source_url: https://laws.e-gov.go.jp/api/1/articles;lawId=129AC0000000089;article=939
    locator: 民法 第939条
    jurisdiction: JP
    topic: inheritance/renunciation/effect
    level: gold
    ttl_days: 730
  # ---- Japan: Japan Pension Service (unpaid pension and the death report), added 15 Oct 2026 --------
  - id: jp_pension_unpaid_family
    text: Pension a pensioner had not yet received when they died, up to and including the month of death, is paid as unpaid pension (未支給年金) to the family member who shared their household.
    quote: 亡くなった月分までの年金については、未支給年金としてその方と生計を同じくしていた遺族が受け取ることができます。
    quote_translation: "Pension up to the month of death is received, as unpaid pension, by the bereaved family member who shared the deceased's livelihood."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/who
    level: gold
    ttl_days: 365
  - id: jp_pension_unpaid_order
    text: The family members who may claim unpaid pension, in this order, are the spouse, children, parents, grandchildren, grandparents, brothers and sisters, then other relatives to the third degree, each of whom shared the deceased's household.
    quote: （1）配偶者 （2）子 （3）父母 （4）孫 （5）祖父母 （6）兄弟姉妹 （7）その他（1）から（6）以外の3親等内の親族です。
    quote_translation: "(1) spouse (2) children (3) parents (4) grandchildren (5) grandparents (6) brothers and sisters (7) other relatives within the third degree."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/order
    level: gold
    ttl_days: 365
  - id: jp_pension_unpaid_first
    text: Only the first in that order may claim unpaid pension; when two or more stand equal, one of them claims for all.
    quote: 先順位者がいる場合は、未支給年金を受け取ることはできません。また、同順位者が2名以上いる場合は、そのうち1名が代表して請求することとなります。
    quote_translation: "If someone comes earlier in the order, you cannot receive the unpaid pension; if two or more stand at the same place, one of them claims as their representative."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/order
    level: gold
    ttl_days: 365
  - id: jp_pension_unpaid_form
    text: Unpaid pension is claimed with the combined pensioner's death report and unpaid pension claim form.
    quote: 未支給年金を受け取るためには、「年金受給権者死亡届（報告書）兼 未支給年金・未支払給付金請求書」の提出が必要です。
    quote_translation: "To receive unpaid pension, the 'pension recipient death report (report) and claim for unpaid pension and unpaid benefits' must be submitted."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/form
    level: gold
    ttl_days: 365
  - id: jp_pension_certificate
    text: The pensioner's death report goes in with their pension certificate and a paper showing the death, such as an extract of the family register or the closed resident record.
    quote: 亡くなった方の年金証書と、死亡を明らかにすることができる書類（戸籍抄本または住民票の除票など）を添えて
    quote_translation: "Attaching the deceased's pension certificate and a document that can show the death (such as an extract of the family register or the removed resident record)."
    source_url: https://www.nenkin.go.jp/faq/jukyu/jukyushatodoke/kyotsu/shibo/20140421.html
    jurisdiction: JP
    topic: pension/unpaid/documents
    level: gold
    ttl_days: 365
  - id: jp_pension_heir_chart
    text: A certified copy of the heir information chart, with the deceased as the person inherited from, is one of the papers accepted to show the claimant's relationship to the deceased.
    quote: 法定相続情報一覧図の写し（亡くなった方が被相続人であるもの）
    quote_translation: "A copy of the statutory heir information chart (with the deceased as the decedent)."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/documents
    level: gold
    ttl_days: 365
  - id: jp_pension_papers_after_death
    text: Family register and resident record certificates for the claim must have been issued after the date of death.
    quote: 戸籍謄本・住民票は、亡くなった日より後に交付されたものが必要です。
    quote_translation: "Family register and resident record certificates must have been issued after the date of death."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/documents
    level: gold
    ttl_days: 365
  - id: jp_pension_submit_post
    text: The claim is sent to a pension office by post.
    quote: 年金事務所に郵送により提出してください。
    quote_translation: "Please submit it to a pension office by post."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/where
    level: gold
    ttl_days: 365
  - id: jp_pension_unpaid_tax
    text: Unpaid pension counts as occasional income of whoever receives it, and may need a tax return.
    quote: 亡くなった方の未支給年金は、その支給金を受け取った方の一時所得に該当し、確定申告が必要になる場合があります
    quote_translation: "The deceased's unpaid pension is occasional income of the person who receives it, and a tax return may be needed."
    source_url: https://www.nenkin.go.jp/service/jukyu/tetsuduki/kyotsu/jukyu/20140731-01.html
    jurisdiction: JP
    topic: pension/unpaid/tax
    level: gold
    ttl_days: 365
  - id: jp_pension_report_my_number
    text: No separate death report is needed, as a rule, when the Japan Pension Service holds the pensioner's My Number; the unpaid pension must still be claimed.
    quote: 年金受給権者の死亡届は日本年金機構にマイナンバーが収録されている方につきましては、原則不要です。ただし、未支給年金の届出などは必要です。
    quote_translation: "As a rule, a pensioner's death report is not needed when their My Number is held by the Japan Pension Service; however, the claim for unpaid pension and the like is still needed."
    source_url: https://www.nenkin.go.jp/faq/jukyu/jukyushatodoke/kyotsu/shibo/20140421.html
    jurisdiction: JP
    topic: pension/death_report/when
    level: gold
    ttl_days: 365
  - id: jp_pension_report_10_days
    text: When a pensioner's death report is needed, it is due within 10 days of the death (14 days for the National Pension).
    quote: 死亡届が必要な場合は、10日（国民年金は14日）以内に
    quote_translation: "When a death report is needed, within 10 days (14 days for the National Pension)."
    source_url: https://www.nenkin.go.jp/faq/jukyu/jukyushatodoke/kyotsu/shibo/20140421.html
    jurisdiction: JP
    topic: pension/death_report/clock
    level: gold
    ttl_days: 365
  - id: jp_pension_return_overpaid
    text: Pension received for the time after the death, because the death was reported late, has to be paid back.
    quote: なお、届出が遅れ、亡くなった日の翌日以後に年金を受け取ったときは、その分を後日お返しいただくことになりますのでご注意ください。
    quote_translation: "If the report is late and pension is received on or after the day after the death, that amount must be paid back later."
    source_url: https://www.nenkin.go.jp/faq/jukyu/jukyushatodoke/kyotsu/shibo/20140421.html
    jurisdiction: JP
    topic: pension/death_report/overpaid
    level: gold
    ttl_days: 365
  # ---- US: Texas small estate affidavit, SSA survivors, added 14 Oct 2026 ------------------------------
  - id: us_tx_sea_witnesses
