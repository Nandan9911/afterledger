letter:
  lang: ar
  to: "[اسم البنك]"
  subject: طلب المستندات والخطوات المطلوبة لصرف رصيد حساب متوفى
  subject_en: Request for the documents and steps needed to pay a deceased customer's balance to the heirs
  body: 'السادة [اسم البنك]، تحية طيبة وبعد،


    توفي والدي [الاسم] بتاريخ [التاريخ]، وله لديكم حساب ينتهي رقمه بـ [....]. نرجو إفادتنا كتابيًا بالمستندات والخطوات
    المطلوبة لصرف الرصيد للورثة.


    وتفضلوا بقبول فائق الاحترام،'
  translation: 'Dear [bank name],


    My father [name] died on [date], and he had an account with you ending in [....]. Please tell us in writing
    which documents and steps you need to pay the balance to the heirs.


    Yours faithfully,'
  cites: []
