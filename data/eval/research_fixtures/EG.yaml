first_answer:
  lang: ar
  found_official: false
  text: "لم نعثر على خطوات منشورة لدى البنك لحسابات المتوفَّين. لذلك لن نضع أي قاعدة في أوراقك قبل أن يؤكدها البنك كتابيًا."
  translation: "We found no steps the bank publishes for deceased customers' accounts. So no rule goes into your papers until the bank confirms it in writing."
  general:
    - شهادة الوفاة
    - إعلام الوراثة
    - بطاقات هوية الورثة
    - خطاب يطلب من البنك خطواته
  general_en:
    - The death certificate
    - The court's determination of heirs (إعلام الوراثة)
    - The heirs' identity cards
    - A letter asking the bank for its steps
  cites: []
