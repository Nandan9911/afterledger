_note: 'Scripted responses for the offline research run on France. They stand in for what Gemini returns in a live
  run: the questions planned, the pages each researcher reads, the quotes copied from them (plus one deliberately
  misquoted line the citation checker must drop), the adjudication, and the compiled plan. Every quote except the
  trap is word for word on the page snapshot. The first round misses what to do when the death was more than ten
  years ago; Researcher A says so, and the second round (rounds: 2) finds it on the same page. Each assertion, query
  and trap names the question it answers, so a researcher given some of the questions finds only theirs.'
need_key: FR/life_policy
plan_key: FR/life_insurance_search
questions:
- id: q1
  question: How can a family in France find out whether a person who died held life insurance naming them?
  variable: route
  language: fr
  queries:
  - assurance-vie savoir si on est bénéficiaire assuré décédé
  - Agira recherche contrat assurance-vie décès
- id: q2
  question: Does the request cost anything, and which papers must go with it?
  variable: documents
  language: fr
  queries:
  - demande Agira gratuite acte de décès
- id: q3
  question: How long does an insurer have to tell a beneficiary?
  variable: clock
  language: fr
  queries:
  - assureur délai informer bénéficiaire assurance-vie
first_answer:
  lang: fr
  text: Interrogez l'Agira. Elle informe toutes les compagnies d'assurance du décès, pour une personne décédée depuis
    moins de 10 ans. C'est gratuit ; joignez une copie de l'acte de décès.
  translation: Ask AGIRA. It tells every insurer about the death, for anyone who died less than 10 years ago. It
    is free; attach a copy of the death certificate.
  cites:
  - fr_agira_ask
  - fr_agira_informs_insurers
  - fr_agira_10_years
  - fr_agira_free
  - fr_agira_death_cert
