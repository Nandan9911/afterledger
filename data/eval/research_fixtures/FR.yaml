assertions:
- id: fr_agira_ask
  question: q1
  text: To find out whether someone who died had life insurance, ask AGIRA.
  quote: Il faut interroger l'Agira.
  quote_translation: You have to ask AGIRA.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search
  level: dual_verified
  ttl_days: 180
- id: fr_agira_10_years
  question: q1
  text: AGIRA searches for life insurance of people who died less than 10 years ago.
  quote: L'Agira est compétente pour rechercher les contrats d'assurance-vie d'une personne décédée depuis moins
    de 10 ans.
  quote_translation: AGIRA can search for the life insurance contracts of a person who died less than 10 years ago.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search
  level: dual_verified
  ttl_days: 180
- id: fr_agira_over_10
  question: r2q1
  text: For a death more than 10 years ago, ask the Caisse des dépôts through its Ciclade service.
  quote: Si la personne est décédée depuis plus de 10 ans, il faut s'adresser à la Caisse des dépôts et consignations
    (CDC) en utilisant son service en ligne Ciclade.
  quote_translation: If the person died more than 10 years ago, contact the Caisse des dépôts et consignations through
    its online Ciclade service.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search
  level: dual_verified
  ttl_days: 180
- id: fr_agira_free
  question: q2
  text: The AGIRA request is free.
  quote: Une demande auprès de l'Agira est gratuite.
  quote_translation: A request to AGIRA is free.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search/fee
  level: dual_verified
  ttl_days: 90
- id: fr_agira_online
  question: q2
  text: The request can be made online, or by post for those who cannot use the internet.
  quote: Vous pouvez effectuer la démarche sur internet (ou par courrier postal si vous ne pouvez pas utiliser internet)
  quote_translation: You can do this online (or by post if you cannot use the internet).
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search/channel
  level: dual_verified
  ttl_days: 180
- id: fr_agira_death_cert
  question: q2
  text: The request must include a copy of the death certificate.
  quote: vous devez joindre une copie de l'acte de décès de la personne qui aurait souscrit le contrat.
  quote_translation: you must attach a copy of the death certificate of the person who may have taken out the contract.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search/documents
  level: dual_verified
  ttl_days: 180
- id: fr_agira_informs_insurers
  question: q1
  text: AGIRA tells every insurer about the death.
  quote: l'Agira va informer l'ensemble des compagnies d'assurance du décès de l'assuré.
  quote_translation: AGIRA will inform all insurance companies of the insured person's death.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search
  level: dual_verified
  ttl_days: 180
- id: fr_insurer_1_month
  question: q3
  text: If you are a beneficiary, the insurer has one month to tell you about the contract.
  quote: l'assureur a 1 mois pour vous informer de l'existence d'un contrat à votre profit.
  quote_translation: the insurer has 1 month to inform you of a contract in your favour.
  source_url: https://www.justice.fr/fiche/assurance-vie-savoir-on-beneficiaire-assure-decede
  jurisdiction: FR
  topic: life_insurance/search/clock
  level: dual_verified
  ttl_days: 180
