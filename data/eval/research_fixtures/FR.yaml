letter:
  lang: fr
  to: AGIRA
  subject: Demande de recherche de contrats d'assurance sur la vie
  subject_en: Request to search for life insurance contracts
  body: 'Madame, Monsieur,


    Je vous prie de bien vouloir rechercher si mon père, [NOM ET PRÉNOM], né le [DATE DE NAISSANCE] et décédé le
    [DATE DU DÉCÈS] à Lyon, avait souscrit un contrat d''assurance sur la vie. Vous trouverez ci-joint une copie
    de son acte de décès.


    Je vous prie d''agréer, Madame, Monsieur, l''expression de mes salutations distinguées.'
  translation: 'Dear Sir or Madam,


    Please search whether my father, [FULL NAME], born on [DATE OF BIRTH] and who died on [DATE OF DEATH] in Lyon,
    had taken out a life insurance contract. Please find enclosed a copy of his death certificate.


    Yours faithfully,'
  cites:
  - fr_agira_ask
  - fr_agira_death_cert
